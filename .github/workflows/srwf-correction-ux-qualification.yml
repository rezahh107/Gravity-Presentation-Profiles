name: SRWF Correction UX Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/srwf-correction-ux-qualification.yml'
      - 'tests/repro-evidence-lab/srwf-journey-host-correction-ux-*'
      - 'tests/repro-evidence-lab/srwf-journey-host-runtime.php'
      - 'tests/repro-evidence-lab/srwf-journey-production-setup.php'
      - 'tests/repro-evidence-lab/srwf-journey-production-host-control.php'
      - 'tests/repro-evidence-lab/srwf-journey-production-mr4-host-control.php'
      - 'tests/fixtures/wu21-packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Pinned Correction geometry RTL and CTA qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-srwf-correction-root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-srwf-correction-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WU21_WP_PATH: /tmp/srwf-correction-wordpress
      WU21_ARTIFACT_DIR: /tmp/srwf-correction-artifacts
      WU21_PACKAGE_FIXTURE_DIR: tests/fixtures/wu21-packages
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080
      WU21_HELLO_VERSION: '3.5.1'
      WU21_HELLO_COMMIT: e86d30a7d64b2ab59373422a14933bba3621ee04
      WU21_HELLO_SHA256: d5b36b9d33187bf8b9cd5ad324489aab7ad8c3a21b5f2e5df82c18964a026ce5

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          mkdir -p "$WU21_ARTIFACT_DIR"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.35'
          coverage: none
          extensions: mysqli
          tools: composer:2.8.12

      - name: Qualification file validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.3.35"
          composer validate --no-check-publish
          php -l tests/repro-evidence-lab/srwf-journey-host-correction-ux-source-probe.php
          php -l tests/repro-evidence-lab/srwf-journey-host-correction-ux-label-control.php
          node --check tests/repro-evidence-lab/srwf-journey-host-correction-ux-browser.mjs
          bash scripts/validate-production-reachability.sh .
          php tests/run.php

      - name: Install exact WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
          mkdir -p "$WU21_WP_PATH"
          php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=7.1.1 --force
          php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-srwf-correction-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title='SRWF Correction UX Qualification' --admin_user=bootstrap_admin --admin_password='wu21-bootstrap-pass-2026' --admin_email=bootstrap@example.invalid --skip-email
          php "$WU21_WP_CLI" user create srwf_participant participant@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass='srwf-participant-pass-2026'
          php "$WU21_WP_CLI" option update home "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" option update siteurl "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure '/%postname%/'
          test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "7.1.1"

      - name: Verify and install exact Gravity packages
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$GITHUB_WORKSPACE/$WU21_PACKAGE_FIXTURE_DIR"
          php tests/repro-evidence-lab/verify-wu21-package-fixtures.php "$fixture_root"
          gf_zip="$fixture_root/gravityforms-3.1.1.1-owner-supplied-source-package.zip"
          flow_zip="$fixture_root/gravityflow-3.1.0-owner-supplied-source-package.zip"
          test "$(stat -c '%s' "$gf_zip")" = '5300290'
          test "$(stat -c '%s' "$flow_zip")" = '2603034'
          echo "542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  $gf_zip" | sha256sum -c -
          echo "ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404  $flow_zip" | sha256sum -c -
          unzip -q "$gf_zip" -d "$WU21_WP_PATH/wp-content/plugins"
          unzip -q "$flow_zip" -d "$WU21_WP_PATH/wp-content/plugins"
          grep -q '^Version: 3\.1\.1\.1$' "$WU21_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
          grep -q '^Version: 3\.1\.0$' "$WU21_WP_PATH/wp-content/plugins/gravityflow/gravityflow.php"

      - name: Install exact GTB Registration dependency
        shell: bash
        run: |
          set -euo pipefail
          gtb_sha='b594d7a87fc904e86dedac5cfd3bd1aa3eb33d15'
          rm -rf /tmp/gravity-theme-builder
          git init -q /tmp/gravity-theme-builder
          git -C /tmp/gravity-theme-builder remote add origin https://github.com/rezahh107/Gravity-Theme-Builder.git
          git -C /tmp/gravity-theme-builder fetch -q --depth=1 origin "$gtb_sha"
          git -C /tmp/gravity-theme-builder checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/gravity-theme-builder rev-parse HEAD)" = "$gtb_sha"
          mkdir -p "$WU21_WP_PATH/wp-content/plugins/srwf-registration-theme"
          cp -a /tmp/gravity-theme-builder/themes/srwf-registration/src/. "$WU21_WP_PATH/wp-content/plugins/srwf-registration-theme/"
          grep -q '^ \* Version: 0\.1\.19$' "$WU21_WP_PATH/wp-content/plugins/srwf-registration-theme/srwf-registration-theme.php"

      - name: Install exact Hello Elementor target host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hello-elementor "$WU21_WP_PATH/wp-content/themes/hello-elementor"
          curl -L --fail --retry 3 -o /tmp/hello-elementor.tar.gz "https://github.com/elementor/hello-theme/archive/$WU21_HELLO_COMMIT.tar.gz"
          echo "$WU21_HELLO_SHA256  /tmp/hello-elementor.tar.gz" | sha256sum -c -
          mkdir -p /tmp/hello-elementor
          tar -xzf /tmp/hello-elementor.tar.gz -C /tmp/hello-elementor --strip-components=1
          mv /tmp/hello-elementor "$WU21_WP_PATH/wp-content/themes/hello-elementor"
          test "$(php "$WU21_WP_CLI" theme get hello-elementor --field=version --path="$WU21_WP_PATH")" = "$WU21_HELLO_VERSION"

      - name: Activate exact packages and create canonical journey fixture
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
          php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles srwf-registration-theme --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-runtime.php
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-host-manifest.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-production-setup.php
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-setup.json"
          php "$WU21_WP_CLI" theme activate hello-elementor --path="$WU21_WP_PATH"
          test "$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")" = 'hello-elementor'

      - name: Capture exact pinned CTA source seam
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-correction-ux-source-probe.php
          test -s "$WU21_ARTIFACT_DIR/srwf-correction-ux-source-probe.json"

      - name: Set up exact Node runtime and Playwright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.55.0') process.exit(1);"

      - name: Capture authentic Correction geometry RTL and CTA behavior
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/srwf-correction-wp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null
          node tests/repro-evidence-lab/srwf-journey-host-correction-ux-browser.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-correction-ux-browser.json"
          kill "$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srwf-correction-ux-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/srwf-correction-artifacts/**
            /tmp/srwf-correction-wp-server.log
          if-no-files-found: warn
          retention-days: 30
