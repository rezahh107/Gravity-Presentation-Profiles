name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-wu21-package-fixtures:
    name: One-time WU21 package fixture migration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR Head for fixture migration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Seed exact package bytes when absent
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          root="tests/fixtures/wu21-packages"
          if [[ -f "$root/manifest.json" ]]; then
            echo "WU21 package fixtures already present."
            exit 0
          fi
          mkdir -p "$root"
          curl -L --fail --retry 4 -o "$root/gravityforms-3.1.1.1-owner-supplied-source-package.zip" "https://drive.usercontent.google.com/download?id=10pDROZVyqELKzSzIiJrOyEWKjxS8r22Q&export=download&confirm=t"
          curl -L --fail --retry 4 -o "$root/gravityflow-3.1.0-owner-supplied-source-package.zip" "https://drive.usercontent.google.com/download?id=1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf&export=download&confirm=t"
          curl -L --fail --retry 4 -o "$root/elementor-4.3.1-owner-supplied-source-package.zip" "https://drive.usercontent.google.com/download?id=1tyRkQ4a_E_wz2cL2KcNPMr2Q5P5yX7UR&export=download&confirm=t"
          curl -L --fail --retry 4 -o "$root/elementor-pro-4.3.0-owner-supplied-modified-package.zip" "https://drive.usercontent.google.com/download?id=1nSNzFyZJd1aMrManYhmXOxSzRgivjMwg&export=download&confirm=t"
          test "$(stat -c '%s' "$root/gravityforms-3.1.1.1-owner-supplied-source-package.zip")" = "5300290"
          test "$(stat -c '%s' "$root/gravityflow-3.1.0-owner-supplied-source-package.zip")" = "2603034"
          test "$(stat -c '%s' "$root/elementor-4.3.1-owner-supplied-source-package.zip")" = "23188841"
          test "$(stat -c '%s' "$root/elementor-pro-4.3.0-owner-supplied-modified-package.zip")" = "3446055"
          echo "542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  $root/gravityforms-3.1.1.1-owner-supplied-source-package.zip" | sha256sum -c -
          echo "ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404  $root/gravityflow-3.1.0-owner-supplied-source-package.zip" | sha256sum -c -
          echo "9e947ce507a6c76d22ec7c710da96b65ecc7da18703dc662a6940f5443491c8d  $root/elementor-4.3.1-owner-supplied-source-package.zip" | sha256sum -c -
          echo "4745d1688b8533aed8d4bfadbfa03f5ab007bbdfc6cfe705a01a48fbdf82bbe0  $root/elementor-pro-4.3.0-owner-supplied-modified-package.zip" | sha256sum -c -
          cp /dev/stdin "$root/manifest.json" <<'JSON'
          {
            "schema_version": "1.0.0",
            "packages": [
              {"id":"gravityforms","version":"3.1.1.1","filename":"gravityforms-3.1.1.1-owner-supplied-source-package.zip","classification":"OWNER_SUPPLIED_SOURCE_PACKAGE","size_bytes":5300290,"sha256":"542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b"},
              {"id":"gravityflow","version":"3.1.0","filename":"gravityflow-3.1.0-owner-supplied-source-package.zip","classification":"OWNER_SUPPLIED_SOURCE_PACKAGE","size_bytes":2603034,"sha256":"ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404"},
              {"id":"elementor","version":"4.3.1","filename":"elementor-4.3.1-owner-supplied-source-package.zip","classification":"OWNER_SUPPLIED_SOURCE_PACKAGE","size_bytes":23188841,"sha256":"9e947ce507a6c76d22ec7c710da96b65ecc7da18703dc662a6940f5443491c8d"},
              {"id":"elementor-pro","version":"4.3.0","filename":"elementor-pro-4.3.0-owner-supplied-modified-package.zip","classification":"OWNER_SUPPLIED_MODIFIED_PACKAGE","size_bytes":3446055,"sha256":"4745d1688b8533aed8d4bfadbfa03f5ab007bbdfc6cfe705a01a48fbdf82bbe0"}
            ]
          }
          JSON
          git add "$root"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: seed exact WU21 package fixtures'
          git push origin "HEAD:$TARGET_BRANCH"

  repository-guardrails:
  repository-guardrails:
    name: Merge-result / push validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge result or pushed commit
        uses: actions/checkout@v4

      - name: Assert merge-result or pushed-commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.sha }}"
          echo "observed_checkout=$actual"
          echo "expected_checkout=$expected"
          test "$actual" = "$expected"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Verify required governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "AGENTS.md"
            "SECURITY.md"
            "CHANGELOG.md"
            "docs/architecture/MOTHER_ARCHITECTURE.md"
            "docs/visual/README.md"
            "profiles/README.md"
            ".distignore"
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required repository file: $file" >&2; exit 1; }
          done

      - name: Verify architecture identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "document_id: GPP-MOTHER-ARCHITECTURE" docs/architecture/MOTHER_ARCHITECTURE.md
          grep -q "canonical_plugin_repository: rezahh107/Gravity-Presentation-Profiles" docs/architecture/MOTHER_ARCHITECTURE.md
          grep -q "first_major_profile_family: SRWF" docs/architecture/MOTHER_ARCHITECTURE.md

      - name: Validate visual governance
        shell: bash
        run: bash scripts/validate-visual-governance.sh .

      - name: Run visual governance falsification controls
        shell: bash
        run: bash tests/visual-governance-guardrail.sh

      - name: Validate production reachability
        shell: bash
        run: bash scripts/validate-production-reachability.sh .

      - name: Run production reachability falsification controls
        shell: bash
        run: bash tests/production-reachability-guardrail.sh

      - name: Lint production and test PHP
        shell: bash
        run: |
          set -euo pipefail
          find gravity-presentation-profiles.php src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run GPP core tests
        run: php tests/run.php

      - name: Reject committed release archives
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files '*.zip' | grep -q .; then
            echo "Committed ZIP archives are not allowed in the source repository." >&2
            git ls-files '*.zip'
            exit 1
          fi

  exact-head-guardrails:
    name: Exact-Head validation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact Head identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "observed_checkout=$actual"
          echo "expected_checkout=$expected"
          test "$actual" = "$expected"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Verify required governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "AGENTS.md"
            "SECURITY.md"
            "CHANGELOG.md"
            "docs/architecture/MOTHER_ARCHITECTURE.md"
            "docs/visual/README.md"
            "profiles/README.md"
            ".distignore"
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required repository file: $file" >&2; exit 1; }
          done

      - name: Verify architecture identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "document_id: GPP-MOTHER-ARCHITECTURE" docs/architecture/MOTHER_ARCHITECTURE.md
          grep -q "canonical_plugin_repository: rezahh107/Gravity-Presentation-Profiles" docs/architecture/MOTHER_ARCHITECTURE.md
          grep -q "first_major_profile_family: SRWF" docs/architecture/MOTHER_ARCHITECTURE.md

      - name: Validate visual governance
        shell: bash
        run: bash scripts/validate-visual-governance.sh .

      - name: Run visual governance falsification controls
        shell: bash
        run: bash tests/visual-governance-guardrail.sh

      - name: Validate production reachability
        shell: bash
        run: bash scripts/validate-production-reachability.sh .

      - name: Run production reachability falsification controls
        shell: bash
        run: bash tests/production-reachability-guardrail.sh

      - name: Lint production and test PHP
        shell: bash
        run: |
          set -euo pipefail
          find gravity-presentation-profiles.php src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run GPP core tests
        run: php tests/run.php

      - name: Reject committed release archives
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files '*.zip' | grep -q .; then
            echo "Committed ZIP archives are not allowed in the source repository." >&2
            git ls-files '*.zip'
            exit 1
          fi

  db-advisory-lock-contract:
    name: DB advisory lock (${{ matrix.database }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
          - database: mariadb
            image: mariadb:11.4
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: gpp
          MYSQL_DATABASE: gpp_lock_test
        ports:
          - 3306/tcp
    steps:
      - name: Checkout exact requested Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact Head identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "observed_checkout=$actual"
          echo "expected_checkout=$expected"
          test "$actual" = "$expected"

      - name: Set up PHP with mysqli
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli

      - name: Run database advisory-lock contract
        run: php tests/integration/db-advisory-lock.php
        env:
          GPP_DB_VARIANT: ${{ matrix.database }}
          GPP_DB_HOST: 127.0.0.1
          GPP_DB_PORT: ${{ job.services.database.ports[3306] }}
          GPP_DB_USER: root
          GPP_DB_PASSWORD: gpp
          GPP_DB_NAME: gpp_lock_test
