name: WU18 Entry Detail Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wu18-entry-detail-runtime.yml'
      - 'src/**'
      - 'assets/**'
      - 'tests/cases/entry-detail-presentation-model.php'
      - 'tests/cases/entry-detail-production-activation.php'
      - 'tests/cases/entry-detail-setup-conflict.php'
      - 'tests/cases/entry-detail-setup-diagnostics.php'
      - 'tests/cases/entry-detail-settings-contract.php'
      - 'tests/repro-evidence-lab/setup-wu18-fixtures.php'
      - 'tests/repro-evidence-lab/inspect-wu18-host-seams.php'
      - 'tests/repro-evidence-lab/create-wu18-unbound-form.php'
      - 'tests/repro-evidence-lab/wu18-*'
      - 'tests/repro-evidence-lab/wu09-entry-*'
      - 'tests/repro-evidence-lab/wu02-entry-visibility-differential.mjs'
      - 'profiles/srwf/operations/operations-package-v1.json'
      - 'gravity-presentation-profiles.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-detail-runtime:
    name: WU18 pinned native Entry Detail
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-wu18-root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-wu18-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WU21_WP_PATH: /tmp/wu18-wordpress
      WU21_ARTIFACT_DIR: /tmp/wu18-artifacts
      WU21_PACKAGE_DIR: /tmp/wu18-packages
      WU21_GF_ZIP: /tmp/wu18-packages/gravityforms-3.1.1.1-owner-supplied-source-package.zip
      WU21_FLOW_ZIP: /tmp/wu18-packages/gravityflow-3.1.0-owner-supplied-source-package.zip
      WU21_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      WU21_FLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      WU21_GF_SIZE: '5300290'
      WU21_FLOW_SIZE: '2603034'
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$WU21_ARTIFACT_DIR" "$WU21_PACKAGE_DIR"
      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.33'
          coverage: none
          extensions: mysqli
          tools: composer:2.8.12
      - name: Repository-native validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.3.33"
          composer validate --no-check-publish
          bash scripts/validate-visual-governance.sh .
          bash tests/visual-governance-guardrail.sh
          bash scripts/validate-production-reachability.sh .
          find gravity-presentation-profiles.php src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m py_compile tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py
          php tests/run.php
      - name: Install exact WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
          mkdir -p "$WU21_WP_PATH"
          php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=7.1.1 --force
          php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-wu18-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title='WU18 Synthetic Lab' --admin_user=bootstrap_admin --admin_password='wu21-bootstrap-pass-2026' --admin_email='bootstrap@example.invalid' --skip-email
          php "$WU21_WP_CLI" user create wu21_viewer wu21.viewer@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass='wu21-synthetic-viewer-2026'
          php "$WU21_WP_CLI" option update home "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" option update siteurl "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure '/%postname%/'
          test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "7.1.1"
          template="$(php "$WU21_WP_CLI" option get template --path="$WU21_WP_PATH")"
          stylesheet="$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")"
          test -d "$WU21_WP_PATH/wp-content/themes/$template"
          test -d "$WU21_WP_PATH/wp-content/themes/$stylesheet"
      - name: Fetch and byte-verify owner-supplied Gravity packages
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -o "$WU21_GF_ZIP" "https://drive.usercontent.google.com/download?id=10pDROZVyqELKzSzIiJrOyEWKjxS8r22Q&export=download&confirm=t"
          curl -L --fail --retry 4 -o "$WU21_FLOW_ZIP" "https://drive.usercontent.google.com/download?id=1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf&export=download&confirm=t"
          test "$(stat -c '%s' "$WU21_GF_ZIP")" = "$WU21_GF_SIZE"
          test "$(stat -c '%s' "$WU21_FLOW_ZIP")" = "$WU21_FLOW_SIZE"
          echo "$WU21_GF_SHA256  $WU21_GF_ZIP" | sha256sum -c -
          echo "$WU21_FLOW_SHA256  $WU21_FLOW_ZIP" | sha256sum -c -
          unzip -q "$WU21_GF_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
          unzip -q "$WU21_FLOW_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
          grep -q '^Version: 3\.1\.1\.1$' "$WU21_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
          grep -q '^Version: 3\.1\.0$' "$WU21_WP_PATH/wp-content/plugins/gravityflow/gravityflow.php"
      - name: Activate exact plugins and qualify Entry Detail settings-save
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
          php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/inspect-wu18-host-seams.php
          test -s "$WU21_ARTIFACT_DIR/wu18-host-seam-inventory.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-fixtures.php
          test -s "$WU21_ARTIFACT_DIR/fixture-manifest.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/create-wu18-unbound-form.php
          unbound_form_id="$(tr -d '\r\n' < "$WU21_ARTIFACT_DIR/wu18-unbound-form-id.txt")"
          test "$unbound_form_id" -gt 0
          form_id="$(php -r '$d=json_decode(file_get_contents($argv[1]),true); if(!is_array($d)||empty($d["forms"][0]["form_id"])) exit(2); echo (int)$d["forms"][0]["form_id"];' "$WU21_ARTIFACT_DIR/fixture-manifest.json")"
          test "$form_id" -gt 0
          export WU18_SETUP_FORM_ID="$form_id"

          mkdir -p "$WU21_WP_PATH/wp-content/mu-plugins"
          cp tests/repro-evidence-lab/wu18-admin-settings-context-probe.php "$WU21_WP_PATH/wp-content/mu-plugins/gpp-wu18-admin-settings-context-probe.php"
          cp tests/repro-evidence-lab/wu18-admin-setup-request.php "$WU21_WP_PATH/wu18-admin-setup-request.php"
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/wu18-setup-probe-server.log 2>&1 &
          setup_server_pid=$!
          trap 'kill "$setup_server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null

          settings_url="$WU21_BASE_URL/wp-admin/admin.php?page=gf_settings&subview=gravity-presentation-profiles"
          cookie_jar=/tmp/wu18-admin-cookies.txt
          settings_html=/tmp/wu18-gpp-settings.html
          curl -sS -c "$cookie_jar" "$WU21_BASE_URL/wp-login.php" >/dev/null
          curl -sS -L -b "$cookie_jar" -c "$cookie_jar" \
            --data-urlencode 'log=bootstrap_admin' \
            --data-urlencode 'pwd=wu21-bootstrap-pass-2026' \
            --data-urlencode 'wp-submit=Log In' \
            --data-urlencode "redirect_to=$WU21_BASE_URL/wp-admin/" \
            --data-urlencode 'testcookie=1' \
            "$WU21_BASE_URL/wp-login.php" -o /tmp/wu18-login.html
          curl -fsS -b "$cookie_jar" -c "$cookie_jar" "$settings_url" -o "$settings_html"
          grep -Fq 'id="gform-settings"' "$settings_html"
          grep -Fq 'name="gform_settings_save_nonce"' "$settings_html"
          grep -Fq 'name="gform-settings-save" value="save"' "$settings_html"
          grep -Fq 'Operations Setup (Entry Detail)' "$settings_html"
          grep -Fq 'Initialize / Adopt Entry Detail presentation' "$settings_html"
          grep -Fq 'name="_gform_setting_entry_detail_setup_action"' "$settings_html"
          grep -Fq "form:$form_id" "$settings_html"
          grep -Fq "form:$unbound_form_id" "$settings_html"
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-default --html "$settings_html"
          test -s "$WU21_ARTIFACT_DIR/wu18-admin-settings-context.json"
          grep -q '"gravity_flow_api_loaded_before_autoload_check": true' "$WU21_ARTIFACT_DIR/wu18-admin-settings-context.json"
          grep -q '"form_bound_api_constructible": true' "$WU21_ARTIFACT_DIR/wu18-admin-settings-context.json"
          # Backward-compatibility negative control. This remains distinct from
          # the primary user-facing Gravity Forms settings-save qualification.
          legacy_failure_body=/tmp/wu18-entry-detail-legacy-failure-body.html
          legacy_failure_http="$(curl -sS -o "$legacy_failure_body" -w '%{http_code}' "$WU21_BASE_URL/wu18-admin-setup-request.php?form_id=$unbound_form_id&expect=failure")"
          test "$legacy_failure_http" = "409"
          test -s "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-failure-transition.json"
          grep -q '"result": "PASS"' "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-failure-transition.json"

          # Primary failure proof: submit the actual host-owned gform-settings
          # form with the unbound control form selected. Gravity Forms must run
          # GPP validation, render its field error, and leave state unchanged.
          failure_form_html=/tmp/wu18-entry-detail-settings-failure-form.html
          failure_response_html=/tmp/wu18-entry-detail-settings-failure-response.html
          failure_post_body=/tmp/wu18-entry-detail-settings-failure.body
          curl -fsS -b "$cookie_jar" -c "$cookie_jar" "$settings_url" -o "$failure_form_html"
          WU18_SETUP_FORM_ID="$unbound_form_id" WU18_SETUP_STATE_LABEL="settings-failure-before" \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-entry-detail-setup-state.php >/dev/null
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py prepare-post \
            --html "$failure_form_html" \
            --form-id "$unbound_form_id" \
            --body "$failure_post_body" \
            --shape "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-failure-request.json"
          settings_failure_http="$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-binary "@$failure_post_body" \
            -o "$failure_response_html" -w '%{http_code}' "$settings_url")"
          test "$settings_failure_http" = "200"
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-error \
            --html "$failure_response_html" \
            --form-id "$unbound_form_id" \
            --message 'No active EnvironmentBindingSet exists for the selected form.'
          WU18_SETUP_FORM_ID="$unbound_form_id" WU18_SETUP_STATE_LABEL="settings-failure-after" \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-entry-detail-setup-state.php >/dev/null
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-transition \
            --expect failure \
            --before "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-settings-failure-before.json" \
            --after "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-settings-failure-after.json" \
            --form-id "$unbound_form_id" \
            --http-status "$settings_failure_http" \
            --out "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-failure-transition.json"

          # Primary success proof: submit the same real gform-settings form for
          # the compatible operations context. No controller/service shortcut is
          # used; Gravity Forms owns request dispatch, nonce, validation and save.
          success_form_html=/tmp/wu18-entry-detail-settings-success-form.html
          success_response_html=/tmp/wu18-entry-detail-settings-success-response.html
          success_post_body=/tmp/wu18-entry-detail-settings-success.body
          success_headers=/tmp/wu18-entry-detail-settings-success-headers.txt
          curl -fsS -b "$cookie_jar" -c "$cookie_jar" "$settings_url" -o "$success_form_html"
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-default --html "$success_form_html"
          WU18_SETUP_FORM_ID="$form_id" WU18_SETUP_STATE_LABEL="settings-success-before" \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-entry-detail-setup-state.php >/dev/null
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py prepare-post \
            --html "$success_form_html" \
            --form-id "$form_id" \
            --body "$success_post_body" \
            --shape "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-success-request.json"
          settings_success_http="$(curl -sS -D "$success_headers" -b "$cookie_jar" -c "$cookie_jar" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-binary "@$success_post_body" \
            -o "$success_response_html" -w '%{http_code}' "$settings_url")"
          case "$settings_success_http" in 200|302) ;; *) sed -n '1,100p' "$success_response_html" >&2 || true; exit 1 ;; esac
          WU18_SETUP_FORM_ID="$form_id" WU18_SETUP_STATE_LABEL="settings-success-after" \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-entry-detail-setup-state.php >/dev/null
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-transition \
            --expect success \
            --before "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-settings-success-before.json" \
            --after "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-settings-success-after.json" \
            --form-id "$form_id" \
            --http-status "$settings_success_http" \
            --out "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-success-transition.json"

          success_reload_html=/tmp/wu18-entry-detail-settings-success-reload.html
          curl -fsS -b "$cookie_jar" -c "$cookie_jar" "$settings_url" -o "$success_reload_html"
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-default --html "$success_reload_html"
          persisted_action="$(php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval 'echo (string) \GravityPresentationProfiles\GravityForms\AddOn::get_instance()->get_plugin_setting("entry_detail_setup_action");')"
          test -z "$persisted_action"

          # Primary idempotent rerun through the same host settings boundary.
          rerun_form_html=/tmp/wu18-entry-detail-settings-rerun-form.html
          rerun_response_html=/tmp/wu18-entry-detail-settings-rerun-response.html
          rerun_post_body=/tmp/wu18-entry-detail-settings-rerun.body
          rerun_headers=/tmp/wu18-entry-detail-settings-rerun-headers.txt
          curl -fsS -b "$cookie_jar" -c "$cookie_jar" "$settings_url" -o "$rerun_form_html"
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-default --html "$rerun_form_html"
          WU18_SETUP_FORM_ID="$form_id" WU18_SETUP_STATE_LABEL="settings-rerun-before" \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-entry-detail-setup-state.php >/dev/null
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py prepare-post \
            --html "$rerun_form_html" \
            --form-id "$form_id" \
            --body "$rerun_post_body" \
            --shape "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-rerun-request.json"
          settings_rerun_http="$(curl -sS -D "$rerun_headers" -b "$cookie_jar" -c "$cookie_jar" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-binary "@$rerun_post_body" \
            -o "$rerun_response_html" -w '%{http_code}' "$settings_url")"
          case "$settings_rerun_http" in 200|302) ;; *) sed -n '1,100p' "$rerun_response_html" >&2 || true; exit 1 ;; esac
          WU18_SETUP_FORM_ID="$form_id" WU18_SETUP_STATE_LABEL="settings-rerun-after" \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-entry-detail-setup-state.php >/dev/null
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-transition \
            --expect rerun \
            --before "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-settings-rerun-before.json" \
            --after "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-settings-rerun-after.json" \
            --form-id "$form_id" \
            --http-status "$settings_rerun_http" \
            --out "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-rerun-transition.json"
          rerun_reload_html=/tmp/wu18-entry-detail-settings-rerun-reload.html
          curl -fsS -b "$cookie_jar" -c "$cookie_jar" "$settings_url" -o "$rerun_reload_html"
          python3 tests/repro-evidence-lab/wu18-gf-settings-save-qualification.py assert-default --html "$rerun_reload_html"
          persisted_rerun_action="$(php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval 'echo (string) \GravityPresentationProfiles\GravityForms\AddOn::get_instance()->get_plugin_setting("entry_detail_setup_action");')"
          test -z "$persisted_rerun_action"

          # Backward-compatible admin-post endpoint remains covered after the
          # primary settings-save success. At this point it must complete as an
          # idempotent positive rerun without changing authoritative state.
          legacy_rerun_headers=/tmp/wu18-entry-detail-legacy-rerun-headers.txt
          legacy_rerun_body=/tmp/wu18-entry-detail-legacy-rerun-body.html
          legacy_rerun_http="$(curl -sS -D "$legacy_rerun_headers" -o "$legacy_rerun_body" -w '%{http_code}' "$WU21_BASE_URL/wu18-admin-setup-request.php?form_id=$form_id&expect=rerun")"
          legacy_rerun_location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {sub(/\r$/, ""); sub(/^Location:[[:space:]]*/, ""); print; exit}' "$legacy_rerun_headers")"
          if [[ "$legacy_rerun_http" != "302" || "$legacy_rerun_location" != *"gpp_entry_detail_setup=completed"* ]]; then
            sed -n '1,80p' "$legacy_rerun_body" >&2 || true
            exit 1
          fi
          test -s "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-rerun-transition.json"
          grep -q '"result": "PASS"' "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-rerun-transition.json"

          python3 - "$WU21_ARTIFACT_DIR/wu18-admin-setup-result.json" "$unbound_form_id" "$legacy_failure_http" "$form_id" "$settings_failure_http" "$settings_success_http" "$settings_rerun_http" "$legacy_rerun_http" "$legacy_rerun_location" <<'PY'
          import json
          import sys
          out, unbound_id, legacy_failure_http, form_id, settings_failure_http, settings_success_http, settings_rerun_http, legacy_rerun_http, legacy_rerun_location = sys.argv[1:]
          payload = {
              'schema_version': '3.0.0',
              'surface': 'gravity_flow.entry_detail',
              'settings_context': 'wp-admin/admin.php?page=gf_settings&subview=gravity-presentation-profiles',
              'settings_ui_owner': 'gravity_forms_addon_settings_api',
              'selected_method_conformance': 'PROVEN',
              'primary_settings_save': {
                  'request_path': 'wp-admin/admin.php?page=gf_settings&subview=gravity-presentation-profiles',
                  'host_form_id': 'gform-settings',
                  'submitted_entry_detail_field': '_gform_setting_entry_detail_setup_action',
                  'failure_control': {
                      'form_id': int(unbound_id),
                      'http_status': int(settings_failure_http),
                      'expected_reason_code': 'entry_detail_binding_context_missing',
                  },
                  'successful_setup': {
                      'form_id': int(form_id),
                      'http_status': int(settings_success_http),
                      'transient_selection_persisted': False,
                  },
                  'idempotent_rerun': {
                      'http_status': int(settings_rerun_http),
                      'transient_selection_persisted': False,
                  },
              },
              'legacy_admin_post_regression': {
                  'request_path': 'wp-admin/admin-post.php',
                  'failure_http_status': int(legacy_failure_http),
                  'idempotent_positive_http_status': int(legacy_rerun_http),
                  'completed_redirect': 'gpp_entry_detail_setup=completed' in legacy_rerun_location,
              },
          }
          with open(out, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY

          # Enforcement-boundary lock: the run is invalid without all three
          # real settings-POST transition artifacts, even if legacy controls pass.
          for artifact in \
            "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-failure-transition.json" \
            "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-success-transition.json" \
            "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-rerun-transition.json"; do
            test -s "$artifact"
            grep -q '"enforcement_boundary": "real_gform_settings_post"' "$artifact"
            grep -q '"result": "PASS"' "$artifact"
          done

          cat "$WU21_ARTIFACT_DIR/wu18-admin-settings-context.json"
          cat "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-failure-transition.json"
          cat "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-success-transition.json"
          cat "$WU21_ARTIFACT_DIR/wu18-gf-settings-save-rerun-transition.json"
          cat "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-failure-transition.json"
          cat "$WU21_ARTIFACT_DIR/wu18-entry-detail-setup-rerun-transition.json"
          cat "$WU21_ARTIFACT_DIR/wu18-admin-setup-result.json"

          kill "$setup_server_pid" >/dev/null 2>&1 || true
          wait "$setup_server_pid" 2>/dev/null || true
          trap - EXIT
          rm -f "$WU21_WP_PATH/wu18-admin-setup-request.php"
          rm -f "$WU21_WP_PATH/wp-content/mu-plugins/gpp-wu18-admin-settings-context-probe.php"

          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-wu18-fixtures.php
          test -s "$WU21_ARTIFACT_DIR/wu18-fixture-manifest.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu09-entry-route-discovery.php
          test -s "$WU21_ARTIFACT_DIR/wu09-entry-route-discovery.json"
          cat "$WU21_ARTIFACT_DIR/wu09-entry-route-discovery.json"
      - name: Execute native PHP/runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-runtime-tests.php
          test -s "$WU21_ARTIFACT_DIR/wu18-runtime-results.json"
      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install exact Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.55.0') process.exit(1);"
      - name: Start WordPress and execute browser assertions
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/wu18-wp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null
          node tests/repro-evidence-lab/wu18-browser-tests.mjs
          test -s "$WU21_ARTIFACT_DIR/wu18-browser-results.json"
          test -s "$WU21_ARTIFACT_DIR/wu18-entry-detail-native-chrome-desktop.png"
          test -s "$WU21_ARTIFACT_DIR/wu18-entry-detail-native-chrome-mobile.png"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/wu18-post-browser-controls.php
      - name: Upload WU18 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wu18-entry-detail-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/wu18-artifacts/wu18-host-seam-inventory.json
            /tmp/wu18-artifacts/wu18-admin-settings-context.json
            /tmp/wu18-artifacts/wu18-admin-setup-context-failure.json
            /tmp/wu18-artifacts/wu18-admin-setup-context-rerun.json
            /tmp/wu18-artifacts/wu18-admin-setup-result.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-failure-before.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-failure-after.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-failure-transition.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-rerun-before.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-rerun-after.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-rerun-transition.json
            /tmp/wu18-artifacts/wu18-entry-detail-setup-settings-*.json
            /tmp/wu18-artifacts/wu18-gf-settings-save-*.json
            /tmp/wu18-artifacts/wu18-fixture-manifest.json
            /tmp/wu18-artifacts/wu09-entry-*.json
            /tmp/wu18-artifacts/wu18-runtime-results.json
            /tmp/wu18-artifacts/wu18-browser-results.json
            /tmp/wu18-artifacts/wu09-entry-asset-qualification.json
            /tmp/wu18-artifacts/wu09-entry-asset-browser-results.json
            /tmp/wu18-artifacts/wu18-entry-detail-native-chrome-desktop.png
            /tmp/wu18-artifacts/wu18-entry-detail-native-chrome-mobile.png
            /tmp/wu18-gpp-settings.html
            /tmp/wu18-entry-detail-settings-*.html
            /tmp/wu18-setup-probe-server.log
            /tmp/wu18-wp-server.log
          if-no-files-found: warn
          retention-days: 30
