name: Inbox 2 Usability Prototype — Isolated Runtime
'on':
  pull_request:
    branches:
    - main
    - experiment/inbox2-usability-prototype
    - test/inbox2-queue-return-20261108
    paths:
    - tests/qualification-custom-inbox/**
    - .github/workflows/inbox2-usability-prototype.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  qualification:
    name: Inbox 2 isolated scenario — ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [return-fifo, scale, negative-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-wu21-root
          MARIADB_DATABASE: wordpress
        ports:
        - 3306:3306
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-wu21-root --silent" --health-interval=5s
          --health-timeout=5s --health-retries=20
    env:
      CIQ2_SCENARIO: ${{ matrix.scenario }}
      CIQ2_PARITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      WU21_WP_PATH: /tmp/wu21-wordpress
      WU21_ARTIFACT_DIR: /tmp/wu21-artifacts
      WU21_PACKAGE_DIR: /tmp/wu21-packages
      WU21_PACKAGE_FIXTURE_DIR: tests/fixtures/wu21-packages
      WU21_GF_ZIP: /tmp/wu21-packages/gravityforms-3.1.1.1-owner-supplied-source-package.zip
      WU21_FLOW_ZIP: /tmp/wu21-packages/gravityflow-3.1.0-owner-supplied-source-package.zip
      WU21_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      WU21_FLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      WU21_GF_SIZE: '5300290'
      WU21_FLOW_SIZE: '2603034'
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080
      WU21_PERMALINK_STRUCTURE: /%postname%/
      WU21_ELEMENTOR_VERSION: 4.3.1
      WU21_ELEMENTOR_SHA256: 9e947ce507a6c76d22ec7c710da96b65ecc7da18703dc662a6940f5443491c8d
      WU21_ELEMENTOR_SIZE: '23188841'
      WU21_ELEMENTOR_PRO_VERSION: 4.3.0
      WU21_ELEMENTOR_PRO_SHA256: 4745d1688b8533aed8d4bfadbfa03f5ab007bbdfc6cfe705a01a48fbdf82bbe0
      WU21_ELEMENTOR_PRO_SIZE: '3446055'
      WU21_HELLO_VERSION: 3.5.1
      WU21_HELLO_COMMIT: e86d30a7d64b2ab59373422a14933bba3621ee04
      WU21_HELLO_SOURCE_PATH: /tmp/hello-theme
      WU21_HELLO_SHA256: d5b36b9d33187bf8b9cd5ad324489aab7ad8c3a21b5f2e5df82c18964a026ce5
      WU21_VAZIR_REPOSITORY: rezahh107/Vazir
      WU21_VAZIR_COMMIT: ad8feae35a4e1c27fb13d646fa18abf05bb4e7b1
      WU21_VAZIR_PLUGIN_VERSION: 1.3.0
      WU21_VAZIR_SOURCE_PATH: /tmp/wu21-vazir-source
      WU21_DESIGN_AUTHORITY_DIR: /tmp/wu21-artifacts/design-authority-runtime
      WU21_DESIGN_AUTHORITY_STAGE: /tmp/wu21-artifacts/design-authority-runtime/PersianGravity-Visual-Reference-Final.html
    steps:
    - name: Checkout exact authorized PR Head
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Assert repository and exact checkout identity
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
        actual="$(git rev-parse HEAD)"
        expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        echo "GPP_WU21_REPOSITORY_SHA=$actual" >> "$GITHUB_ENV"
        if [[ "${{ github.event_name }}" = "pull_request" ]]; then
          git diff --name-only "${{ github.event.pull_request.base.sha }}"..."$actual" > /tmp/wu21-changed-files.txt
        else
          : > /tmp/wu21-changed-files.txt
        fi
        {
          echo 'GPP_CHANGED_FILES<<EOF'
          cat /tmp/wu21-changed-files.txt
          echo EOF
        } >> "$GITHUB_ENV"
        test "$actual" = "$expected"
        mkdir -p "$WU21_ARTIFACT_DIR" "$WU21_PACKAGE_DIR"

        printf "%s\n" "$actual" > "$WU21_ARTIFACT_DIR/checkout-head.txt"
        printf "%s\n" "$CIQ2_SCENARIO" > "$WU21_ARTIFACT_DIR/scenario.txt"
    - name: Set up exact PHP runtime
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: 8.2.35
        coverage: none
        extensions: mysqli
        tools: composer:2.8.12
    - name: Run repository-native static and regression checks
      shell: bash
      run: |
        set -euo pipefail
        test "$(php -r 'echo PHP_VERSION;')" = "8.2.35"
        composer validate --no-check-publish
        bash scripts/validate-visual-governance.sh .
        bash tests/visual-governance-guardrail.sh
        find gravity-presentation-profiles.php src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
        php tests/run.php
        bash scripts/validate-committed-archives.sh
    - name: Install exact WP-CLI and WordPress
      shell: bash
      run: |
        set -euo pipefail
        if ! curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar; then
          # Transport-only fallback to the official WP-CLI builds repository.
          # The unchanged pinned SHA-256 gate below rejects a different build.
          curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        fi
        echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
        php "$WU21_WP_CLI" --info
        mkdir -p "$WU21_WP_PATH"
        php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=6.8.3 --force
        php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-wu21-root --dbhost=127.0.0.1:3306 --skip-check
        php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title='WU21 Synthetic Lab' --admin_user=bootstrap_admin --admin_password='wu21-bootstrap-pass-2026' --admin_email='bootstrap@example.invalid' --skip-email
        php "$WU21_WP_CLI" user create wu21_viewer wu21.viewer@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass='wu21-synthetic-viewer-2026'
        test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "6.8.3"
        template="$(php "$WU21_WP_CLI" option get template --path="$WU21_WP_PATH")"
        stylesheet="$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")"
        test -n "$template"
        test -n "$stylesheet"
        test -d "$WU21_WP_PATH/wp-content/themes/$template"
        test -d "$WU21_WP_PATH/wp-content/themes/$stylesheet"
    - name: Normalize and assert native WordPress URL state
      shell: bash
      run: |
        set -euo pipefail

        php "$WU21_WP_CLI" option update home "$WU21_BASE_URL" --path="$WU21_WP_PATH"
        php "$WU21_WP_CLI" option update siteurl "$WU21_BASE_URL" --path="$WU21_WP_PATH"
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure "$WU21_PERMALINK_STRUCTURE"

        stored_home="$(php "$WU21_WP_CLI" option get home --path="$WU21_WP_PATH")"
        stored_siteurl="$(php "$WU21_WP_CLI" option get siteurl --path="$WU21_WP_PATH")"
        stored_permalink="$(php "$WU21_WP_CLI" option get permalink_structure --path="$WU21_WP_PATH")"
        test "$stored_home" = "$WU21_BASE_URL"
        test "$stored_siteurl" = "$WU21_BASE_URL"
        test "$stored_permalink" = "$WU21_PERMALINK_STRUCTURE"

        if grep -Eq "^[[:space:]]*define[[:space:]]*\([[:space:]]*['\"]WP_(HOME|SITEURL)['\"]" "$WU21_WP_PATH/wp-config.php"; then
          echo "Rejected parallel WP_HOME/WP_SITEURL URL authority in wp-config.php." >&2
          exit 1
        fi

        test "$WU21_WP_PATH" = "/tmp/wu21-wordpress"
        test "$WU21_BASE_URL" = "http://127.0.0.1:8080"
        grep -Fq 'php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080' "$GITHUB_WORKSPACE/.github/workflows/wu21-repro-evidence-lab.yml"
        if grep -Fq '/wu21-wordpress' "$GITHUB_WORKSPACE/tests/repro-evidence-lab/browser-tests.mjs"; then
          echo "Rejected hardcoded /wu21-wordpress browser workaround." >&2
          exit 1
        fi

        WU21_EXPECTED_URL="$WU21_BASE_URL" php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval '
        $expected = getenv("WU21_EXPECTED_URL");
        $urls = [
            "home_url" => home_url(),
            "site_url" => site_url(),
            "wp_login_url" => wp_login_url(),
            "rest_url" => rest_url(),
            "gravityflow_inbox_admin_url" => admin_url("admin.php?page=gravityflow-inbox"),
        ];

        $fail = static function ($message) use ($urls) {
            fwrite(STDERR, $message . PHP_EOL);
            fwrite(STDERR, wp_json_encode($urls, JSON_UNESCAPED_SLASHES) . PHP_EOL);
            exit(1);
        };

        if ($urls["home_url"] !== $expected) {
            $fail("home_url() does not equal WU21_BASE_URL.");
        }
        if ($urls["site_url"] !== $expected) {
            $fail("site_url() does not equal WU21_BASE_URL.");
        }
        if (! str_starts_with($urls["wp_login_url"], $expected . "/") || str_contains($urls["wp_login_url"], "/wu21-wordpress")) {
            $fail("wp_login_url() escaped the root URL contract.");
        }
        if (! str_starts_with($urls["rest_url"], $expected . "/wp-json/")) {
            $fail("rest_url() does not expose the rewrite-backed wp-json route required by Gravity Flow 3.1.0.");
        }
        if (! str_starts_with($urls["gravityflow_inbox_admin_url"], $expected . "/wp-admin/") || str_contains($urls["gravityflow_inbox_admin_url"], "/wu21-wordpress")) {
            $fail("Gravity Flow Inbox admin_url() escaped the root URL contract.");
        }

        echo wp_json_encode($urls, JSON_UNESCAPED_SLASHES) . PHP_EOL;
        '
    - name: Verify and install repository-owned Gravity packages
      shell: bash
      run: |
        set -euo pipefail
        fixture_root="$GITHUB_WORKSPACE/$WU21_PACKAGE_FIXTURE_DIR"
        php tests/repro-evidence-lab/verify-wu21-package-fixtures.php "$fixture_root"
        cp "$fixture_root/gravityforms-3.1.1.1-owner-supplied-source-package.zip" "$WU21_GF_ZIP"
        cp "$fixture_root/gravityflow-3.1.0-owner-supplied-source-package.zip" "$WU21_FLOW_ZIP"
        test "$(stat -c '%s' "$WU21_GF_ZIP")" = "$WU21_GF_SIZE"
        test "$(stat -c '%s' "$WU21_FLOW_ZIP")" = "$WU21_FLOW_SIZE"
        echo "$WU21_GF_SHA256  $WU21_GF_ZIP" | sha256sum -c -
        echo "$WU21_FLOW_SHA256  $WU21_FLOW_ZIP" | sha256sum -c -
        unzip -q "$WU21_GF_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
        unzip -q "$WU21_FLOW_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
        grep -q '^Version: 3\.1\.1\.1$' "$WU21_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
        grep -q '^Version: 3\.1\.0$' "$WU21_WP_PATH/wp-content/plugins/gravityflow/gravityflow.php"
        echo "WU21_GRAVITYFLOW_SOURCE=$WU21_WP_PATH/wp-content/plugins/gravityflow" >> "$GITHUB_ENV"
    - name: Activate exact plugins and install bounded lab adapter
      shell: bash
      run: |
        set -euo pipefail
        ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
        mkdir -p "$WU21_WP_PATH/wp-content/mu-plugins"
        cp tests/repro-evidence-lab/wu21-lab-plugin.php "$WU21_WP_PATH/wp-content/mu-plugins/wu21-lab-plugin.php"
        php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles --path="$WU21_WP_PATH"
        php "$WU21_WP_CLI" plugin status gravityforms --path="$WU21_WP_PATH"
        php "$WU21_WP_CLI" plugin status gravityflow --path="$WU21_WP_PATH"
        php "$WU21_WP_CLI" plugin status gravity-presentation-profiles --path="$WU21_WP_PATH"
    - name: Create synthetic multi-form workflow fixtures
      id: wu21_fixture_setup
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-fixtures.php
        test -s "$WU21_ARTIFACT_DIR/fixture-manifest.json"
    - name: Capture exact runtime identity
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/capture-runtime.php
        test -s "$WU21_ARTIFACT_DIR/runtime.json"

        python3 - <<'PYRUNTIME'
        import json, hashlib, os, pathlib
        p=pathlib.Path(os.environ['WU21_ARTIFACT_DIR'])/'runtime.json'
        r=json.loads(p.read_text())
        r['provisioning_source_workflow']={k:r['workflow'][k] for k in ['path','definition_sha256']}
        actual=pathlib.Path('.github/workflows/inbox2-usability-prototype.yml')
        r['workflow']['path']=str(actual)
        r['workflow']['definition_sha256']=hashlib.sha256(actual.read_bytes()).hexdigest()
        p.write_text(json.dumps(r,indent=2)+'\n')
        PYRUNTIME
    - name: Execute PHP/native host and semantic-binding tests
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/php-tests.php
    - name: Gate B authentic headless security before any custom UI
      run: set -euo pipefail; php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/headless.php
        | tee "$WU21_ARTIFACT_DIR/ciq-headless.log"
      shell: bash
    - name: Set up exact Node runtime
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.19.0
    - name: Install exact Playwright and Chromium
      shell: bash
      run: |
        set -euo pipefail
        test "$(node --version)" = "v22.19.0"
        npm install --no-save --package-lock=false playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
        npx playwright install --with-deps chromium
        node -e "for(const [p,v] of [['playwright','1.55.0'],['pixelmatch','7.1.0'],['pngjs','7.0.0']]){const a=require(p+'/package.json').version;if(a!==v)process.exit(1);console.log(p+'@'+a)}"
        bash tests/visual-regression/run-contract-tests.sh
    - name: Start ephemeral WordPress HTTP server
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/wu21-wp-server.log 2>&1 &
        echo $! >/tmp/wu21-wp-server.pid
        for i in $(seq 1 30); do
          if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then exit 0; fi
          sleep 1
        done
        cat /tmp/wu21-wp-server.log >&2
        exit 1
    - name: Install test-only second Inbox after successful headless gate
      shell: bash
      run: |
        set -euo pipefail
        cp tests/qualification-custom-inbox/prototype-mu.php "$WU21_WP_PATH/wp-content/mu-plugins/ciq-prototype.php"
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/setup-page.php
        node tests/qualification-custom-inbox/browser.mjs
    - name: Create authentic cell fixture after inherited PR169 browser acceptance
      shell: bash
      run: |
        set -euo pipefail
        cp tests/qualification-custom-inbox/cell-controls-mu.php "$WU21_WP_PATH/wp-content/mu-plugins/cellq-controls.php"
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/cell-setup.php
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/cell-headless.php | tee "$WU21_ARTIFACT_DIR/cellq-headless.log"
    - name: Qualify batch paging, row omission and task parity
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/usability-headless.php | tee "$WU21_ARTIFACT_DIR/ciq2-headless.log"
    - name: Install isolated Inbox 2 without mutating original assignments
      shell: bash
      run: |
        set -euo pipefail
        cp tests/qualification-custom-inbox/usability-mu.php "$WU21_WP_PATH/wp-content/mu-plugins/ciq2-usability.php"
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/usability-setup.php
    - name: Prove scenario-owned WordPress database
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval '
        $scenario = getenv("CIQ2_SCENARIO");
        if (!in_array($scenario, array("return-fifo","scale","negative-baseline"), true)) {
            throw new RuntimeException("invalid_ci_scenario");
        }
        $marker = getenv("GITHUB_RUN_ID").":".getenv("GITHUB_RUN_ATTEMPT").":".
            $scenario.":".getenv("GPP_WU21_REPOSITORY_SHA");
        update_option("ciq2_scenario_isolation_marker",$marker,false);
        if (get_option("ciq2_scenario_isolation_marker") !== $marker) {
            throw new RuntimeException("database_marker_round_trip_failed");
        }
        $f = get_option("cellq_fixture");
        if (!is_array($f) || empty($f["form_id"])) {
            throw new RuntimeException("scenario_form_missing");
        }
        $steps = (new Gravity_Flow_API((int)$f["form_id"]))->get_steps();
        if (!is_array($steps) || count($steps) < 2) {
            throw new RuntimeException("initial_host_steps_unreadable");
        }
        $step_ids = array();
        foreach ($steps as $step) {
            $step_ids[] = (int)$step->get_id();
        }
        sort($step_ids, SORT_NUMERIC);
        $required = array((int)$f["step_id"], (int)$f["next_step"]);
        if (count($step_ids) !== count(array_unique($step_ids)) ||
            array_diff($required, $step_ids)) {
            throw new RuntimeException("initial_native_step_identity_invalid");
        }
        update_option("ciq2_scenario_initial_step_ids", $step_ids, false);
        if (get_option("ciq2_scenario_initial_step_ids") !== $step_ids) {
            throw new RuntimeException("initial_native_step_snapshot_missing");
        }
        file_put_contents(getenv("WU21_ARTIFACT_DIR")."/scenario-identity.json",
            wp_json_encode(array("head"=>getenv("GPP_WU21_REPOSITORY_SHA"),
                "scenario"=>$scenario, "marker"=>$marker,
                "runner"=>getenv("RUNNER_NAME"),"form_id"=>(int)$f["form_id"],
                "initial_step_ids"=>$step_ids),
                JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
        '
    - name: Reject intentionally invalid scale baseline in disposable negative-control DB
      if: matrix.scenario == 'negative-baseline'
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval "update_option('cellq_mode','deny_entry',false);"
        set +e
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/scale-baseline.php >"$WU21_ARTIFACT_DIR/ciq2-negative-baseline.log" 2>&1
        result=$?
        set -e
        test "$result" -ne 0
        grep -Fq 'scale_baseline_invalid' "$WU21_ARTIFACT_DIR/ciq2-negative-baseline.log"
        php -r '
        $r=json_decode(file_get_contents(getenv("WU21_ARTIFACT_DIR").
          "/ciq2-scale-baseline-negative-baseline.json"),true);
        if (!is_array($r) || ($r["status"]??null)!=="FAIL" ||
            ($r["error"]??null)!=="scale_baseline_invalid" ||
            ($r["count"]??null)!==0) {exit(1);}
        echo "CIQ2_INVALID_SCALE_BASELINE_REJECTED\n";
        '
        test ! -e "$WU21_ARTIFACT_DIR/ciq2-operational-fixture.json"
    - name: Compare native Inbox and Inbox 2 on same synthetic three- and 47-task workloads
      if: matrix.scenario != 'negative-baseline'
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/qualification-custom-inbox/comparison-browser.mjs
        php -l tests/qualification-custom-inbox/comparison-fixture.php
        node tests/qualification-custom-inbox/comparison-browser.mjs
    - name: Three-way parity against independent authentic host oracle (small fixture)
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        php -l tests/qualification-custom-inbox/behavioral-parity-oracle.php
        node --check tests/qualification-custom-inbox/behavioral-parity-browser.mjs
        CIQ2_PARITY_PHASE=initial php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/behavioral-parity-oracle.php
        CIQ2_PARITY_PHASE=initial node tests/qualification-custom-inbox/behavioral-parity-browser.mjs
        # Deliberate observation mutation: the same real browser views and
        # independent oracle are read, but a synthetic candidate ID is removed
        # only from the comparator input. The exact mandatory invariant MUST RED.
        set +e
        CIQ2_PARITY_PHASE=initial CIQ2_PARITY_MUTATION=drop-first \
          node tests/qualification-custom-inbox/behavioral-parity-browser.mjs \
          >"$WU21_ARTIFACT_DIR/ciq2-parity-negative.log" 2>&1
        negative_exit=$?
        set -e
        test "$negative_exit" -ne 0
        node - <<'NODE'
        const fs=require('fs'),p=process.env.WU21_ARTIFACT_DIR+'/';
        const valid=JSON.parse(fs.readFileSync(p+'ciq2-parity-browser-initial.json'));
        const mutant=JSON.parse(fs.readFileSync(p+'ciq2-parity-browser-initial-mutated.json'));
        if(valid.status!=='PASS_THREE_WAY_PARITY' ||
          mutant.status!=='FAIL' ||
          !mutant.error?.includes('PARITY_INBOX2_ID_SET_MISMATCH_officer') ||
          !mutant.officer?.inbox2_ids?.length ||
          mutant.officer.compared_inbox2_ids.length!==mutant.officer.inbox2_ids.length-1)
          process.exit(1);
        console.log('CIQ2_PARITY_INTENTIONAL_RED_CONFIRMED');
        NODE
    - name: Observe authentic Native readiness lifecycle — initial
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/qualification-custom-inbox/native-readiness-diagnostic.mjs
        # Collect all independent phases even when readiness is not yet proven.
        # The mandatory final gate rejects every nonzero or NOT_PROVEN result.
        set +e
        CIQ2_PARITY_PHASE=initial node tests/qualification-custom-inbox/native-readiness-diagnostic.mjs >"$WU21_ARTIFACT_DIR/ciq2-native-readiness-initial.log" 2>&1
        diagnostic_exit=$?
        set -e
        printf '%s\n' "$diagnostic_exit" >"$WU21_ARTIFACT_DIR/ciq2-native-readiness-initial.exit"
        test -s "$WU21_ARTIFACT_DIR/ciq2-native-readiness-initial.json"
        tail -n 8 "$WU21_ARTIFACT_DIR/ciq2-native-readiness-initial.log"
    - name: Run retained Inbox 2 browser authorization and transition tests
      if: matrix.scenario != 'negative-baseline'
      shell: bash
      run: |
        set -euo pipefail
        node tests/qualification-custom-inbox/usability-browser.mjs
    - name: Requalify three-way parity after real native workflow transition
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        CIQ2_PARITY_PHASE=after-usability php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/behavioral-parity-oracle.php
        CIQ2_PARITY_PHASE=after-usability node tests/qualification-custom-inbox/behavioral-parity-browser.mjs
    - name: Observe authentic Native readiness lifecycle — after-usability
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/qualification-custom-inbox/native-readiness-diagnostic.mjs
        # Collect all independent phases even when readiness is not yet proven.
        # The mandatory final gate rejects every nonzero or NOT_PROVEN result.
        set +e
        CIQ2_PARITY_PHASE=after-usability node tests/qualification-custom-inbox/native-readiness-diagnostic.mjs >"$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-usability.log" 2>&1
        diagnostic_exit=$?
        set -e
        printf '%s\n' "$diagnostic_exit" >"$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-usability.exit"
        test -s "$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-usability.json"
        tail -n 8 "$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-usability.log"
    - name: Qualify queue return and BFCache lifecycle with authentic small host fixture
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/qualification-custom-inbox/queue-return-browser.mjs
        node tests/qualification-custom-inbox/queue-return-browser.mjs
    - name: Requalify three-way empty queue after authentic native approval and move
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        CIQ2_PARITY_PHASE=after-native php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/behavioral-parity-oracle.php
        CIQ2_PARITY_PHASE=after-native node tests/qualification-custom-inbox/behavioral-parity-browser.mjs
    - name: Observe authentic Native readiness lifecycle — after-native
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/qualification-custom-inbox/native-readiness-diagnostic.mjs
        # Collect all independent phases even when readiness is not yet proven.
        # The mandatory final gate rejects every nonzero or NOT_PROVEN result.
        set +e
        CIQ2_PARITY_PHASE=after-native node tests/qualification-custom-inbox/native-readiness-diagnostic.mjs >"$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-native.log" 2>&1
        diagnostic_exit=$?
        set -e
        printf '%s\n' "$diagnostic_exit" >"$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-native.exit"
        test -s "$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-native.json"
        tail -n 8 "$WU21_ARTIFACT_DIR/ciq2-native-readiness-after-native.log"
    - name: Discriminate entry-age from late actionable-step FIFO semantics
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        php -l tests/qualification-custom-inbox/fifo-timing-counterexample.php
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/fifo-timing-counterexample.php
    - name: Verify final FIFO inventory and entry teardown
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        php -r '
        $r=json_decode(file_get_contents(getenv("WU21_ARTIFACT_DIR").
          "/ciq2-fifo-counterexample.json"),true);
        if (!is_array($r) ||
            ($r["status"]??null)!=="PASS_COUNTEREXAMPLE_WITH_VERIFIED_ENTRY_TEARDOWN" ||
            ($r["cleanup_verified"]??null)!==true ||
            ($r["cleanup_entries_verified"]??null)!==true ||
            !isset($r["step_inventory_before"],$r["step_inventory_after_addition"],
              $r["step_inventory_after_teardown"]) ||
            !in_array($r["workflow_teardown"]??null,
              array("ORIGINAL_STEP_INVENTORY_RESTORED",
                    "RESIDUAL_STEP_DISPOSE_WITH_SCENARIO"),true)) {exit(1);}
        echo "CIQ2_FIFO_TEARDOWN_EXPLICIT_AND_VERIFIED\n";
        '
        # Nothing may consume this database after FIFO; the runner and its
        # MariaDB service are disposed of as this matrix job finishes.
    - name: Require complete and falsifiable Native readiness diagnostic evidence
      if: matrix.scenario == 'return-fifo'
      shell: bash
      run: |
        set -euo pipefail
        node - <<'NODE'
        const fs=require('fs'),dir=process.env.WU21_ARTIFACT_DIR;
        for(const phase of ['initial','after-usability','after-native']){
          const name=dir+'/ciq2-native-readiness-'+phase;
          const exit=fs.readFileSync(name+'.exit','utf8').trim();
          const report=JSON.parse(fs.readFileSync(name+'.json','utf8'));
          if(exit!=='0' || report.status!=='PASS' ||
             !Array.isArray(report.scenarios) ||
             !report.scenarios.length ||
             report.scenarios.some(s=>s.status!=='PASS'))
            throw Error('NATIVE_READINESS_DIAGNOSTIC_NOT_PROVEN_'+phase);
          if(phase==='initial'){
            const labels=report.scenarios.map(s=>s.scenario);
            for(const label of ['initial-officer','initial-viewer','blocked','delayed','failed','withheld-data'])
              if(!labels.includes(label))throw Error('NATIVE_READINESS_SCENARIO_MISSING_'+label);
          }
          console.log('CIQ2_NATIVE_READINESS_DIAGNOSTIC_WITNESSES_PASS '+phase);
        }
        NODE
    - name: Verify fresh independent scale baseline before 500-task creation
      if: matrix.scenario == 'scale'
      shell: bash
      run: |
        set -euo pipefail
        php -l tests/qualification-custom-inbox/scale-baseline.php
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/scale-baseline.php
    - name: Qualify 500/501 native task membership and operational Live Refresh
      if: matrix.scenario == 'scale'
      shell: bash
      run: |
        set -euo pipefail
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/operational-headless.php | tee "$WU21_ARTIFACT_DIR/ciq2-operational-headless.log"
        node --check tests/qualification-custom-inbox/operational-browser.mjs
        node tests/qualification-custom-inbox/operational-browser.mjs
    - name: Reject real native membership mutations during and between scans
      if: matrix.scenario == 'scale'
      shell: bash
      run: |
        set -euo pipefail
        php -l tests/qualification-custom-inbox/operational-mutations.php
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/operational-mutations.php | tee "$WU21_ARTIFACT_DIR/ciq2-operational-mutations.log"
    - name: Measure legitimate native and Inbox 2 HTTP polling at 501 tasks
      if: matrix.scenario == 'scale'
      shell: bash
      timeout-minutes: 8
      run: |
        set -euo pipefail
        php -l tests/qualification-custom-inbox/native-cost-mu.php
        node --check tests/qualification-custom-inbox/native-cost-browser.mjs
        cp tests/qualification-custom-inbox/native-cost-mu.php "$WU21_WP_PATH/wp-content/mu-plugins/ciq2-native-cost.php"
        node tests/qualification-custom-inbox/native-cost-browser.mjs 501
    - name: Measure authentic 2000-task boundary and 2001 fail-closed behavior
      if: matrix.scenario == 'scale'
      shell: bash
      timeout-minutes: 12
      run: |
        set -euo pipefail
        php -l tests/qualification-custom-inbox/operational-scale.php
        php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/qualification-custom-inbox/operational-scale.php | tee "$WU21_ARTIFACT_DIR/ciq2-operational-scale.log"
    - name: Measure legitimate native and Inbox 2 HTTP polling at 2000 tasks
      if: matrix.scenario == 'scale'
      shell: bash
      timeout-minutes: 9
      run: |
        set -euo pipefail
        node tests/qualification-custom-inbox/native-cost-browser.mjs 2000
    - name: Upload isolated evidence even on failure
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: independent-inbox-host-${{ github.run_id }}-${{ matrix.scenario }}
        path: |-
          /tmp/wu21-artifacts/
          /tmp/wu21-wp-server.log
        if-no-files-found: error

  required-qualification:
    # Keep the original required-check name and enforce all three matrix jobs.
    name: Inbox 2 mobile RTL and batch query qualification
    needs: qualification
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Reject failed or skipped independent qualification groups
      shell: bash
      run: |
        set -euo pipefail
        test "${{ needs.qualification.result }}" = "success"
