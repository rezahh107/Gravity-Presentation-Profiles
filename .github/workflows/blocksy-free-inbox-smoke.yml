name: Blocksy Free authentic Inbox smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/blocksy-free-inbox-smoke.yml'
      # A change to either native Inbox consumer or generic operational paint
      # requires the original, unweakened pinned Blocksy browser gate.
      - 'src/Core/Presentation/OperationalVisualPreferences.php'
      - 'src/SRWF/GravityFlow/InboxOperationalPaint.php'
      - 'src/SRWF/GravityFlow/InboxPresentationAdapter.php'
      - 'tests/repro-evidence-lab/blocksy-free-inbox-smoke.mjs'
      - 'tests/repro-evidence-lab/pr159-schema11-frontend-paint-qualification.mjs'
      # Schema 1.1 frontend probe: package and WP-CLI lifecycle driver.
      - 'tests/fixtures/generic-operational-paint-v11.json'
      - 'tests/repro-evidence-lab/generic-operational-v11-control.php'
      # Authentic current-post pages and their native Block composition owner.
      - 'tests/repro-evidence-lab/setup-fixtures.php'
      - 'tests/repro-evidence-lab/p06-inbox-asset-reachability-runtime.php'
      - 'src/SRWF/GravityFlow/InboxBlockCompositionBridge.php'
      # Exact immutable activation / restoration authorities used by the driver.
      - 'src/Core/Lifecycle/VisualPackageLifecycle.php'
      - 'src/Core/Lifecycle/WordPressOptionStateStore.php'
      - 'tests/repro-evidence-lab/blocksy-free-inbox-qualification.mjs'
      - 'tests/repro-evidence-lab/blocksy-qualification-completeness.mjs'
      - 'tests/repro-evidence-lab/blocksy-qualification-completeness-falsification.mjs'
      # Cross-surface qualification must re-exercise the original 26-case Inbox
      # and its fail-closed controls on the same exact PR Head.
      - '.github/workflows/srwf-journey-host-qualification.yml'
      - '.github/workflows/wu19-a4-print-runtime.yml'
      - 'tests/repro-evidence-lab/srwf-journey-production-mr6-integrated-browser.mjs'
      - 'tests/repro-evidence-lab/wu19-browser-tests.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocksy-authentic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-wu21-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-wu21-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WU21_WP_PATH: /tmp/wu21-wordpress
      WU21_ARTIFACT_DIR: /tmp/blocksy-authentic-smoke
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080
      BLOCKSY_VERSION: '2.1.59'
      GPP_BLOCKSY_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$WU21_ARTIFACT_DIR"

      - name: Set up WU21 PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          coverage: none
          extensions: mysqli

      - name: Install pinned WordPress and WP-CLI
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.2.34"
          curl --fail --location --retry 3 --output "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
          mkdir -p "$WU21_WP_PATH"
          php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=6.8.3 --force
          php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-wu21-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title="Blocksy GPP Smoke" --admin_user=bootstrap_admin --admin_password="synthetic-smoke-only-2026" --admin_email=bootstrap@example.invalid --skip-email
          php "$WU21_WP_CLI" user create wu21_viewer wu21.viewer@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass="synthetic-viewer-only-2026"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure '/%postname%/'
          # WU21 canonical root-URL normalization: without it wp-cli/server
          # can emit /wu21-wordpress/ asset and page paths which return HTML
          # instead of JS/CSS. This is fixture authority, not a Blocksy fix.
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option update home "$WU21_BASE_URL"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option update siteurl "$WU21_BASE_URL"
          test "$(php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option get home)" = "$WU21_BASE_URL"
          test "$(php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option get siteurl)" = "$WU21_BASE_URL"
          WU21_EXPECTED_URL="$WU21_BASE_URL" php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval '
            $expected = getenv("WU21_EXPECTED_URL");
            foreach (array("home_url" => home_url(), "site_url" => site_url(), "login" => wp_login_url(), "rest" => rest_url()) as $key => $url) {
              if (("home_url" === $key || "site_url" === $key) ? $url !== $expected : !str_starts_with($url, $expected . "/")) {
                throw new RuntimeException("WU21 canonical URL mismatch in " . $key . ": " . $url);
              }
              if (str_contains($url, "/wu21-wordpress/")) {
                throw new RuntimeException("Fixture leaked local WP directory: " . $key . " " . $url);
              }
            }
          '
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" language core install fa_IR
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option update WPLANG fa_IR
          test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "6.8.3"

      - name: Install and record official Blocksy Free
        run: |
          set -euo pipefail
          theme_zip="$RUNNER_TEMP/blocksy-$BLOCKSY_VERSION.zip"
          curl --fail --location --retry 3 --output "$theme_zip" "https://downloads.wordpress.org/theme/blocksy.$BLOCKSY_VERSION.zip"
          unzip -tq "$theme_zip"
          sha256sum "$theme_zip" | tee "$WU21_ARTIFACT_DIR/blocksy-zip-sha256.txt"
          php "$WU21_WP_CLI" theme install "$theme_zip" --activate --path="$WU21_WP_PATH"
          BLOCKSY_ZIP="$theme_zip" php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval '
            $theme = wp_get_theme();
            if ($theme->get_stylesheet() !== "blocksy" || $theme->get_template() !== "blocksy" || is_child_theme() || $theme->get("Version") !== getenv("BLOCKSY_VERSION")) {
              throw new RuntimeException("Official Blocksy Free parent identity mismatch.");
            }
            foreach (array("elementor/elementor.php", "elementor-pro/elementor-pro.php", "blocksy-companion/blocksy-companion.php") as $plugin) {
              if (is_plugin_active($plugin)) { throw new RuntimeException("Unexpected companion: " . $plugin); }
            }
            $record = array("theme" => $theme->get_stylesheet(), "parent" => $theme->get_template(), "version" => $theme->get("Version"), "child" => is_child_theme(), "package_sha256" => hash_file("sha256", getenv("BLOCKSY_ZIP")), "package_bytes" => filesize(getenv("BLOCKSY_ZIP")), "wp" => get_bloginfo("version"), "php" => PHP_VERSION, "rtl" => is_rtl());
            file_put_contents(getenv("WU21_ARTIFACT_DIR") . "/blocksy-runtime.json", wp_json_encode($record, JSON_PRETTY_PRINT) . "\n");
            if (!is_rtl()) { throw new RuntimeException("Persian WordPress site did not enter RTL."); }
          '
          test -s "$WU21_ARTIFACT_DIR/blocksy-runtime.json"

      - name: Install pinned Gravity Forms and Gravity Flow with GPP source
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/tests/fixtures/wu21-packages"
          php tests/repro-evidence-lab/verify-wu21-package-fixtures.php "$root"
          unzip -q "$root/gravityforms-3.1.1.1-owner-supplied-source-package.zip" -d "$WU21_WP_PATH/wp-content/plugins"
          unzip -q "$root/gravityflow-3.1.0-owner-supplied-source-package.zip" -d "$WU21_WP_PATH/wp-content/plugins"
          ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
          mkdir -p "$WU21_WP_PATH/wp-content/mu-plugins"
          cp tests/repro-evidence-lab/wu21-lab-plugin.php "$WU21_WP_PATH/wp-content/mu-plugins/wu21-lab-plugin.php"
          php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles --path="$WU21_WP_PATH"
          for name in gravityforms gravityflow gravity-presentation-profiles; do
            php "$WU21_WP_CLI" plugin is-active "$name" --path="$WU21_WP_PATH"
          done
          if php "$WU21_WP_CLI" plugin is-active elementor --path="$WU21_WP_PATH"; then exit 1; fi
          if php "$WU21_WP_CLI" plugin is-active blocksy-companion --path="$WU21_WP_PATH"; then exit 1; fi

      - name: Create authentic WU21 and P06 synthetic Inbox fixtures
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-fixtures.php
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/p06-inbox-asset-reachability-runtime.php
          test -s "$WU21_ARTIFACT_DIR/fixture-manifest.json"
          test -s "$WU21_ARTIFACT_DIR/p06-fixture-initialization.json"

      - name: Install pinned Chromium
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Prepare browser
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start WordPress HTTP
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >"$WU21_ARTIFACT_DIR/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent "$WU21_BASE_URL/wp-login.php" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$WU21_ARTIFACT_DIR/server.log" >&2
          exit 1

      - name: Exercise full-page Blocksy Inbox browser smoke
        run: node tests/repro-evidence-lab/blocksy-free-inbox-smoke.mjs

      - name: Qualify native Blocksy page title and authentic Inbox interaction coverage
        id: extended_qualification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A previous or partially written artifact must never satisfy the gate.
          rm -f "$WU21_ARTIFACT_DIR/blocksy-extended-qualification.json" \
            "$WU21_ARTIFACT_DIR/blocksy-extended-runner.json"
          set +e
          node tests/repro-evidence-lab/blocksy-free-inbox-qualification.mjs \
            2>&1 | tee "$WU21_ARTIFACT_DIR/blocksy-extended-qualification.log"
          outcomes=("${PIPESTATUS[@]}")
          set -e
          node_exit="${outcomes[0]}"
          tee_exit="${outcomes[1]}"
          NODE_EXIT="$node_exit" TEE_EXIT="$tee_exit" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { executionIdentity } from './tests/repro-evidence-lab/blocksy-qualification-completeness.mjs';
          fs.writeFileSync(path.join(process.env.WU21_ARTIFACT_DIR, 'blocksy-extended-runner.json'),
            JSON.stringify({
              execution_identity: executionIdentity(),
              exit_code: Number(process.env.NODE_EXIT),
              log_exit_code: Number(process.env.TEE_EXIT),
            }, null, 2) + '\n');
          NODE
          # Preserve the real runner outcome even with continue-on-error.
          if test "$node_exit" -ne 0; then exit "$node_exit"; fi
          if test "$tee_exit" -ne 0; then exit "$tee_exit"; fi

      - name: Qualify activated schema 1.1 paint on authentic frontend Shortcode and Block
        run: node tests/repro-evidence-lab/pr159-schema11-frontend-paint-qualification.mjs

      - name: Falsify captured pageerror verdict in authentic Chromium
        shell: bash
        run: |
          set -euo pipefail
          # The first, ordinary invocation MUST have passed. Force a real
          # uncaught page exception only after passing shortcode-1440 DOM,
          # geometry, RTL, asset and HTTP assertions.
          set +e
          GPP_BLOCKSY_INJECT_PAGEERROR=shortcode-1440 node tests/repro-evidence-lab/blocksy-free-inbox-smoke.mjs \
            >"$WU21_ARTIFACT_DIR/pageerror-negative-control.log" 2>&1
          negative_exit=$?
          set -e
          test "$negative_exit" -ne 0
          NEGATIVE_EXIT="$negative_exit" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.WU21_ARTIFACT_DIR;
          const normal = JSON.parse(fs.readFileSync(path.join(root, 'blocksy-browser-smoke.json'), 'utf8'));
          const mutant = JSON.parse(fs.readFileSync(path.join(root, 'blocksy-browser-smoke-negative.json'), 'utf8'));
          const log = fs.readFileSync(path.join(root, 'pageerror-negative-control.log'), 'utf8');
          const marker = 'GPP_BLOCKSY_PAGEERROR_FALSIFICATION';
          assert.equal(normal.status, 'PASS', 'Positive control must be clean.');
          assert.equal(normal.scenarios.length, 7);
          assert.deepEqual(normal.page_errors, [], 'Positive control emitted unexpected page exceptions.');
          assert.deepEqual(normal.errors, [], 'Positive control emitted assertion failures.');
          assert.ok(Number(process.env.NEGATIVE_EXIT) > 0, 'Mutation did not cause nonzero exit.');
          assert.equal(mutant.status, 'FAIL', 'Captured pageerror was excluded from verdict.');
          assert.equal(mutant.scenarios.length, 7, 'Mutation dropped an existing scenario.');
          const injected = mutant.scenarios.find(s => s.name === 'shortcode-1440');
          assert.equal(injected?.dom_assertions_passed, true, 'Injection did not occur after DOM/assertion success.');
          assert.ok(injected.geometry?.ag_row_count > 0 && injected.geometry?.gpp_inbox_css?.length === 2,
            'Positive authentic DOM/CSS geometry preconditions were not demonstrated.');
          assert.equal(injected.status, 'FAIL', 'Passing DOM assertions overrode page exception.');
          assert.ok(injected.page_errors?.some(message => message.includes(marker)),
            'Scenario-level uncaught page exception evidence missing.');
          assert.ok(mutant.page_errors.some(message => message.includes(marker)),
            'Recorded pageerror evidence missing.');
          assert.ok(mutant.errors.some(issue => issue.scenario === 'shortcode-1440' && issue.error.includes(marker)),
            'Aggregate diagnostic error evidence missing.');
          assert.ok(mutant.page_errors.every(message => mutant.errors.some(issue => issue.error.includes(message))),
            'At least one captured page exception was excluded from the final diagnostic verdict.');
          assert.ok(mutant.scenarios.filter(s => s.name !== 'shortcode-1440').every(s => s.status === 'PASS'),
            'Negative control unexpectedly changed another scenario.');
          assert.match(log, /BLOCKSY_AUTHENTIC_SMOKE_FAIL/, 'Process did not expose failing verdict.');
          assert.ok(fs.existsSync(path.join(root, 'shortcode-1440-negative.png')),
            'Failure screenshot artifact missing.');
          console.log('BLOCKSY_PAGEERROR_NEGATIVE_CONTROL_PASS captured=' + mutant.page_errors.length +
            ' exit=' + process.env.NEGATIVE_EXIT);
          NODE

      - name: Falsify failed Blocksy stylesheet delivery in authentic Chromium
        shell: bash
        run: |
          set -euo pipefail
          # Keep the normal and prior pageerror mutation evidence intact.
          # Abort the real browser request for Blocksy CSS only on shortcode-1440.
          set +e
          GPP_BLOCKSY_INJECT_CSS_FAILURE=shortcode-1440 node tests/repro-evidence-lab/blocksy-free-inbox-smoke.mjs \
            >"$WU21_ARTIFACT_DIR/blocksy-css-negative-control.log" 2>&1
          negative_exit=$?
          set -e
          test "$negative_exit" -ne 0
          NEGATIVE_EXIT="$negative_exit" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.WU21_ARTIFACT_DIR;
          const normal = JSON.parse(fs.readFileSync(path.join(root, 'blocksy-browser-smoke.json'), 'utf8'));
          const injected = JSON.parse(fs.readFileSync(path.join(root, 'blocksy-browser-smoke-css-negative.json'), 'utf8'));
          const pageerrorControl = JSON.parse(fs.readFileSync(path.join(root, 'blocksy-browser-smoke-negative.json'), 'utf8'));
          const log = fs.readFileSync(path.join(root, 'blocksy-css-negative-control.log'), 'utf8');
          assert.equal(normal.status, 'PASS', 'Normal Blocksy smoke lost PASS.');
          assert.equal(normal.scenarios.length, 7, 'Normal seven scenarios changed.');
          assert.ok(normal.scenarios.every(record => record.status === 'PASS' &&
            record.blocksy_css_delivery?.link_count > 0 &&
            record.blocksy_css_delivery?.applied_witness_count > 0 &&
            record.blocksy_css_delivery.sheets.every(sheet => sheet.cssom_attached &&
              sheet.css_rule_count > 0 && sheet.media_matches && !sheet.disabled && !sheet.cssom_error)),
          'Positive browser CSSOM/application evidence missing.');
          assert.equal(pageerrorControl.status, 'FAIL', 'Existing pageerror mutation evidence overwritten.');
          assert.ok(pageerrorControl.page_errors.some(message =>
            message.includes('GPP_BLOCKSY_PAGEERROR_FALSIFICATION')), 'Existing pageerror control missing.');
          assert.ok(Number(process.env.NEGATIVE_EXIT) > 0, 'CSS failure returned zero exit.');
          assert.equal(injected.status, 'FAIL', 'Failed Blocksy CSS returned PASS.');
          assert.equal(injected.scenarios.length, 7, 'CSS negative control dropped scenarios.');
          const affected = injected.scenarios.find(record => record.name === 'shortcode-1440');
          assert.equal(affected?.status, 'FAIL', 'CSS failure did not fail its scenario.');
          assert.ok(affected?.blocksy_css_delivery?.injected_failed_requests > 0,
            'Fault injection did not actually intercept a browser Blocksy CSS request.');
          assert.ok(affected.blocksy_css_delivery.sheets.some(sheet =>
            !sheet.cssom_attached || sheet.css_rule_count === 0 || !!sheet.cssom_error),
          'CSSOM evidence did not expose failed browser stylesheet.');
          assert.match(affected.error, /BLOCKSY_CSS_DELIVERY_GUARD/,
            'Failure did not originate in selected Blocksy asset verification guard.');
          assert.doesNotMatch(affected.error, /geometry|Grid|overflow|stylesheet HTTP delivery failed/,
            'Negative control was reported as an unrelated DOM/geometry/GPP failure.');
          assert.equal(affected.geometry, undefined,
            'CSS negative control ran after rather than before geometry assertions.');
          assert.ok(injected.errors.some(error => error.scenario === 'shortcode-1440' &&
            error.error.includes('BLOCKSY_CSS_DELIVERY_GUARD')),
          'Aggregate diagnostic evidence did not preserve CSS guard failure.');
          assert.ok(injected.scenarios.filter(record => record.name !== 'shortcode-1440')
            .every(record => record.status === 'PASS'), 'CSS failure leaked to other cases.');
          assert.match(log, /BLOCKSY_AUTHENTIC_SMOKE_FAIL/, 'Negative process failed without normal verdict reporting.');
          assert.ok(fs.existsSync(path.join(root, 'shortcode-1440-css-negative.png')),
            'CSS failure screenshot not generated.');
          console.log('BLOCKSY_CSS_DELIVERY_NEGATIVE_CONTROL_PASS blocked=' +
            affected.blocksy_css_delivery.injected_failed_requests +
            ' exit=' + process.env.NEGATIVE_EXIT);
          NODE

      - name: Falsify extended execution-completeness gate
        if: steps.extended_qualification.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node tests/repro-evidence-lab/blocksy-qualification-completeness-falsification.mjs

      - name: Enforce extended qualification verdict
        if: always()
        env:
          GPP_BLOCKSY_STEP_OUTCOME: ${{ steps.extended_qualification.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node tests/repro-evidence-lab/blocksy-qualification-completeness.mjs --gate \
            "$WU21_ARTIFACT_DIR/blocksy-extended-qualification.json" \
            "$WU21_ARTIFACT_DIR/blocksy-extended-runner.json"

      - name: Accept mixed-readiness on authentic Gravity Flow native Inbox
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/inbox-mixed-readiness-fixture.php
          test -s "$WU21_ARTIFACT_DIR/inbox-mixed-readiness-php.json"
          node tests/repro-evidence-lab/inbox-mixed-readiness-browser.mjs
          test -s "$WU21_ARTIFACT_DIR/inbox-mixed-readiness-browser.json"

      - name: Upload authentic smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blocksy-free-inbox-smoke
          path: /tmp/blocksy-authentic-smoke/
          if-no-files-found: warn
