name: PR18 Qualification Cascade Diagnostic

on:
  push:
    branches: [test/core-spine-visual-qualification]
    paths: ['.github/workflows/pr18-cascade-diagnostic.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/core-spine-visual-qualification
          fetch-depth: 1
      - name: Apply semantic-oracle repair and cascade diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          core = 'tests/repro-evidence-lab/core-spine-browser-tests.mjs'
          replace_once(core,
          '''      native_visible: Boolean(native && getComputedStyle(native).display !== 'none'),
                body: document.body.innerText.replace(/\\s+/g, ' ').trim(),''',
          '''      native_visible: Boolean(native && getComputedStyle(native).display !== 'none'),
                native_editor_text: dossier?.querySelector('[data-gpp-native-editor]')?.innerText?.replace(/\\s+/g, ' ').trim() || '',
                body: document.body.innerText.replace(/\\s+/g, ' ').trim(),''')
          replace_once(core,
          '''    if (entryDrift.national_id === drift.replacement_value || entryDrift.body.includes(drift.replacement_value)) throw new Error('Entry Detail guessed the similar-looking replacement field.');
              if (printDrift.national_id === drift.replacement_value || printDrift.body.includes(drift.replacement_value)) throw new Error('Print guessed the similar-looking replacement field.');
              if (printDrift.national_id !== '' || !traceHas(printDrift, 'PRINT_BINDINGS_EVALUATED', 'source_unavailable')) throw new Error(`Print did not fail closed at the stale source: ${JSON.stringify(printDrift)}`);''',
          '''    const replacementVisibleInNativeEditor = entryDrift.native_editor_text.includes(drift.replacement_value);
              if (!replacementVisibleInNativeEditor) throw new Error('Schema-drift falsification control is invalid: replacement value is not visible in the native editor.');
              if (entryDrift.national_id === drift.replacement_value) throw new Error('Entry Detail semantic national-id rebound to the similar-looking replacement field.');
              if (printDrift.national_id === drift.replacement_value) throw new Error('Print semantic national-id rebound to the similar-looking replacement field.');
              if (printDrift.national_id !== '' || !traceHas(printDrift, 'PRINT_BINDINGS_EVALUATED', 'source_unavailable')) throw new Error(`Print did not fail closed at the stale source: ${JSON.stringify(printDrift)}`);''')
          replace_once(core,
          '''    return { source_field_removed: true, similar_field_created: true, fuzzy_rebind: false, stale_source_failed_closed: true, explicit_repair_observed_by_entry_detail: true, explicit_repair_observed_by_print: true };''',
          '''    return { source_field_removed: true, similar_field_created: true, replacement_visible_in_native_editor: replacementVisibleInNativeEditor, semantic_oracle_scope: 'authoritative_slot_and_print_trace_only', fuzzy_rebind: false, stale_source_failed_closed: true, explicit_repair_observed_by_entry_detail: true, explicit_repair_observed_by_print: true };''')

          entry = 'tests/repro-evidence-lab/entry-visual-contract-tests.mjs'
          replace_once(entry,
          '''    const csRoot = getComputedStyle(root); const csSection = getComputedStyle(identity); const csTask = getComputedStyle(task);
              const h1 = identity.querySelector('h1'); const h2 = task.querySelector('h2');
              return {''',
          '''    const csRoot = getComputedStyle(root); const csSection = getComputedStyle(identity); const csTask = getComputedStyle(task);
              const h1 = identity.querySelector('h1'); const h2 = task.querySelector('h2');
              const fontSizeCascade = (() => {
                const candidates = [];
                const visit = (rules, href) => {
                  for (const rule of rules) {
                    if (rule.type === CSSRule.STYLE_RULE) {
                      let matches = false;
                      try { matches = h2.matches(rule.selectorText); } catch {}
                      const value = rule.style?.fontSize || '';
                      if (matches && value) candidates.push({ rule, href: href || 'inline', selector: rule.selectorText, value, priority: rule.style.getPropertyPriority('font-size') || '' });
                    }
                    if (rule.cssRules) { try { visit(rule.cssRules, href); } catch {} }
                  }
                };
                for (const sheet of document.styleSheets) { try { visit(sheet.cssRules, sheet.href); } catch {} }
                let winner = null;
                for (const candidate of candidates) {
                  const oldValue = candidate.rule.style.getPropertyValue('font-size');
                  const oldPriority = candidate.rule.style.getPropertyPriority('font-size');
                  candidate.rule.style.setProperty('font-size', '101px', oldPriority);
                  const wins = Math.abs(parseFloat(getComputedStyle(h2).fontSize) - 101) < 0.1;
                  candidate.rule.style.setProperty('font-size', oldValue, oldPriority);
                  if (wins) winner = { href: candidate.href, selector: candidate.selector, value: candidate.value, priority: candidate.priority || 'normal' };
                }
                return { computed_px: parseFloat(getComputedStyle(h2).fontSize), winner, candidates: candidates.map(({href,selector,value,priority}) => ({ href, selector, value, priority: priority || 'normal' })) };
              })();
              return {''')
          replace_once(entry,
          '''      h1: { size: parseFloat(getComputedStyle(h1).fontSize), weight: getComputedStyle(h1).fontWeight }, h2: { size: parseFloat(getComputedStyle(h2).fontSize), weight: getComputedStyle(h2).fontWeight },
                weights,''',
          '''      h1: { size: parseFloat(getComputedStyle(h1).fontSize), weight: getComputedStyle(h1).fontWeight }, h2: { size: parseFloat(getComputedStyle(h2).fontSize), weight: getComputedStyle(h2).fontWeight },
                h2FontSizeCascade: fontSizeCascade,
                weights,''')
          PY
          git rm .github/workflows/pr18-cascade-diagnostic.yml
          git config user.name 'gpp-qualification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/repro-evidence-lab/core-spine-browser-tests.mjs tests/repro-evidence-lab/entry-visual-contract-tests.mjs
          git commit -m 'test: scope schema drift oracle and expose task cascade'
          git push origin HEAD:test/core-spine-visual-qualification
