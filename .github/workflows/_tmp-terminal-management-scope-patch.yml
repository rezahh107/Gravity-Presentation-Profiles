name: Temporary terminal scope patch

on:
  push:
    branches:
      - fix/srwf-terminal-management-access

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/srwf-terminal-management-access
          fetch-depth: 0
      - name: Apply exact bounded replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/srwf-gravity-flow-entry-detail-journey.css')
          css = css_path.read_text()
          replacements = {
              '.gravityflow_workflow_detail form:has(.gpp-entry-journey-result[data-gpp-entry-journey-result="approved"]) :is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print),':
              'body:not(.wp-admin) .gravityflow_workflow_detail form:has(.gpp-entry-journey-result[data-gpp-entry-journey-result="approved"]) :is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print),',
              '.gravityflow_workflow_detail form:has(.gpp-entry-journey-result[data-gpp-entry-journey-result="rejected"]) :is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print) {':
              'body:not(.wp-admin) .gravityflow_workflow_detail form:has(.gpp-entry-journey-result[data-gpp-entry-journey-result="rejected"]) :is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print) {',
          }
          for old, new in replacements.items():
              if css.count(old) != 1:
                  raise SystemExit(f'CSS replacement boundary count changed: {old}')
              css = css.replace(old, new, 1)
          css = css.replace(
              ' * DOM and Gravity Flow remains their owner. The separately authorized GPP\n * dossier Print utility is intentionally not selected here.\n */',
              ' * DOM and Gravity Flow remains their owner. This suppression is frontend-only;\n * wp-admin keeps host-native management/recovery surfaces under Gravity Flow\n * authorization. The separately authorized GPP dossier Print utility is intentionally\n * not selected here.\n */',
              1,
          )
          css_path.write_text(css)

          test_path = Path('tests/cases/entry-detail-journey-presentation.php')
          test = test_path.read_text()
          old = "$terminal_boundary = '.gravityflow_workflow_detail form:has(' . $terminal_marker . ')';"
          new = "$terminal_boundary = 'body:not(.wp-admin) .gravityflow_workflow_detail form:has(' . $terminal_marker . ')';"
          if test.count(old) != 1:
              raise SystemExit('Static terminal boundary assertion changed unexpectedly.')
          test = test.replace(old, new, 1)
          anchor = "        'MR-5 terminal result must suppress only the proven competing native Entry Detail surfaces for ' . $terminal_state . '.'\n    );"
          addition = anchor + "\n    gpp_journey_assert(\n        false !== strpos( $terminal_boundary, 'body:not(.wp-admin)' ),\n        'MR-5 terminal suppression must remain frontend-only so wp-admin host management stays native for ' . $terminal_state . '.'\n    );"
          if test.count(anchor) != 1:
              raise SystemExit('Static terminal assertion insertion point changed unexpectedly.')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test)
          PY
          php -l tests/cases/entry-detail-journey-presentation.php
          php tests/cases/entry-detail-journey-presentation.php
          git diff --check
      - name: Commit production scope repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/css/srwf-gravity-flow-entry-detail-journey.css tests/cases/entry-detail-journey-presentation.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve native terminal management in wp-admin'
          git push origin HEAD:fix/srwf-terminal-management-access
