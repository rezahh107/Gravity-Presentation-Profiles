name: Temporary Advisory Lock Repair Validation

on:
  push:
    branches:
      - fix/mariadb-advisory-lock-ci-drift

permissions:
  contents: read

jobs:
  validate:
    name: Repaired contract (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mariadb-11.4.8-exact
            image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
            expected_prefix: 11.4.8
          - label: mariadb-11.4.13-exact
            image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
            expected_prefix: 11.4.13
          - label: mysql-8.4
            image: mysql:8.4
            expected_prefix: 8.4
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: gpp
          MYSQL_DATABASE: gpp_lock_test
        ports:
          - 3306/tcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          coverage: none
          extensions: mysqli
      - name: Verify identity and stress repaired contract
        shell: bash
        env:
          GPP_DB_HOST: 127.0.0.1
          GPP_DB_PORT: ${{ job.services.database.ports[3306] }}
          GPP_DB_USER: root
          GPP_DB_PASSWORD: gpp
          GPP_DB_NAME: gpp_lock_test
          GPP_DB_VARIANT: ${{ matrix.label }}
          EXPECTED_PREFIX: ${{ matrix.expected_prefix }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(php -r 'echo PHP_VERSION;')" = '8.2.34'
          echo "mysqli_client=$(php -r 'echo mysqli_get_client_info();')"
          echo "configured_image=$IMAGE"
          docker image inspect "$IMAGE" --format 'repo_digests={{json .RepoDigests}} image_id={{.Id}}'
          version="$(php -r '
            mysqli_report(MYSQLI_REPORT_OFF);
            $db=new mysqli("127.0.0.1","root","gpp","gpp_lock_test",(int)getenv("GPP_DB_PORT"));
            if($db->connect_errno){fwrite(STDERR,$db->connect_error."\n");exit(1);}
            echo $db->query("SELECT VERSION()")->fetch_row()[0];
          ')"
          echo "server_version=$version"
          case "$version" in "$EXPECTED_PREFIX"*) ;; *) echo 'unexpected server version' >&2; exit 1;; esac
          for i in $(seq 1 500); do
            export GPP_DB_VARIANT="${{ matrix.label }}-$i"
            php tests/integration/db-advisory-lock.php >/dev/null
          done
          echo "REPAIRED_ADVISORY_LOCK_STRESS_PASS iterations=500 server=$version"
