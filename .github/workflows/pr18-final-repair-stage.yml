name: Stage final PR18 qualification repair

on:
  push:
    branches: [test/core-spine-visual-qualification]
    paths: ['.github/workflows/pr18-final-repair-stage.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/core-spine-visual-qualification
          fetch-depth: 1
      - name: Apply and stage repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/repro-evidence-lab/pr18-final-patch.py')
          s=p.read_text()
          old='new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new='new, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if s.count(old) != 1: raise SystemExit('regex transport patch precondition failed')
          p.write_text(s.replace(old,new,1))
          PY
          python3 tests/repro-evidence-lab/pr18-final-patch.py
          node --check tests/repro-evidence-lab/core-spine-browser-tests.mjs
          node --check tests/repro-evidence-lab/entry-visual-contract-tests.mjs
          node --check tests/repro-evidence-lab/print-visual-contract-tests.mjs
          php -l src/SRWF/GravityFlow/EntryDetailPresentationAdapter.php
          php -l tests/repro-evidence-lab/build-qualification-evidence.php
          rm -f tests/fixtures/owner-visual/.pr18-cascade-trigger
          git rm .github/workflows/pr18-final-repair-stage.yml tests/repro-evidence-lab/pr18-final-patch.py
          git config user.name 'gpp-qualification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close PR18 qualification defects'
          git push origin HEAD:refs/heads/pr18-final-repair-staged
