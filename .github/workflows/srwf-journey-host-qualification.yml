name: SRWF Journey Host Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/srwf-journey-host-qualification.yml'
      - 'src/Bootstrap.php'
      - 'src/SRWF/GravityFlow/EntryDetailJourneyPresentationAdapter.php'
      - 'assets/js/srwf-gravity-flow-entry-detail.js'
      - 'assets/css/srwf-gravity-flow-entry-detail-journey.css'
      - 'tests/cases/entry-detail-journey-presentation.php'
      - 'tests/run.php'
      - 'tests/repro-evidence-lab/srwf-journey-host-*'
      - 'tests/repro-evidence-lab/srwf-journey-production-*'
      - 'tests/fixtures/wu21-packages/**'
      - 'docs/evidence/SRWF_OPERATOR_JOURNEY_HOST_QUALIFICATION_V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-qualification:
    name: Pinned Gravity Flow journey capability qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-srwf-journey-root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-srwf-journey-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WU21_WP_PATH: /tmp/srwf-journey-wordpress
      WU21_ARTIFACT_DIR: /tmp/srwf-journey-artifacts
      WU21_PACKAGE_FIXTURE_DIR: tests/fixtures/wu21-packages
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080
      WU21_HELLO_VERSION: '3.5.1'
      WU21_HELLO_COMMIT: e86d30a7d64b2ab59373422a14933bba3621ee04
      WU21_HELLO_SHA256: d5b36b9d33187bf8b9cd5ad324489aab7ad8c3a21b5f2e5df82c18964a026ce5

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          mkdir -p "$WU21_ARTIFACT_DIR"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.35'
          coverage: none
          extensions: mysqli
          tools: composer:2.8.12

      - name: Repository-native validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.3.35"
          composer validate --no-check-publish
          bash scripts/validate-visual-governance.sh .
          bash tests/visual-governance-guardrail.sh
          bash scripts/validate-production-reachability.sh .
          find gravity-presentation-profiles.php src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          bash scripts/validate-committed-archives.sh

      - name: Install exact WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
          mkdir -p "$WU21_WP_PATH"
          php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=7.1.1 --force
          php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-srwf-journey-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title='SRWF Journey Qualification' --admin_user=bootstrap_admin --admin_password='wu21-bootstrap-pass-2026' --admin_email=bootstrap@example.invalid --skip-email
          php "$WU21_WP_CLI" user create srwf_participant participant@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass='srwf-participant-pass-2026'
          php "$WU21_WP_CLI" option update home "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" option update siteurl "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure '/%postname%/'
          test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "7.1.1"

      - name: Verify and install repository-owned Gravity packages
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$GITHUB_WORKSPACE/$WU21_PACKAGE_FIXTURE_DIR"
          php tests/repro-evidence-lab/verify-wu21-package-fixtures.php "$fixture_root"
          gf_zip="$fixture_root/gravityforms-3.1.1.1-owner-supplied-source-package.zip"
          flow_zip="$fixture_root/gravityflow-3.1.0-owner-supplied-source-package.zip"
          test "$(stat -c '%s' "$gf_zip")" = '5300290'
          test "$(stat -c '%s' "$flow_zip")" = '2603034'
          echo "542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  $gf_zip" | sha256sum -c -
          echo "ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404  $flow_zip" | sha256sum -c -
          unzip -q "$gf_zip" -d "$WU21_WP_PATH/wp-content/plugins"
          unzip -q "$flow_zip" -d "$WU21_WP_PATH/wp-content/plugins"
          grep -q '^Version: 3\.1\.1\.1$' "$WU21_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
          grep -q '^Version: 3\.1\.0$' "$WU21_WP_PATH/wp-content/plugins/gravityflow/gravityflow.php"

      - name: Install exact GTB Registration qualification dependency
        shell: bash
        run: |
          set -euo pipefail
          gtb_sha='b594d7a87fc904e86dedac5cfd3bd1aa3eb33d15'
          rm -rf /tmp/gravity-theme-builder
          git init -q /tmp/gravity-theme-builder
          git -C /tmp/gravity-theme-builder remote add origin https://github.com/rezahh107/Gravity-Theme-Builder.git
          git -C /tmp/gravity-theme-builder fetch -q --depth=1 origin "$gtb_sha"
          git -C /tmp/gravity-theme-builder checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/gravity-theme-builder rev-parse HEAD)" = "$gtb_sha"
          mkdir -p "$WU21_WP_PATH/wp-content/plugins/srwf-registration-theme"
          cp -a /tmp/gravity-theme-builder/themes/srwf-registration/src/. "$WU21_WP_PATH/wp-content/plugins/srwf-registration-theme/"
          grep -q '^ \* Version: 0\.1\.19$' "$WU21_WP_PATH/wp-content/plugins/srwf-registration-theme/srwf-registration-theme.php"

      - name: Install exact WU21 Hello Elementor MR-4 host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hello-elementor "$WU21_WP_PATH/wp-content/themes/hello-elementor"
          curl -L --fail --retry 3 -o /tmp/hello-elementor.tar.gz "https://github.com/elementor/hello-theme/archive/$WU21_HELLO_COMMIT.tar.gz"
          echo "$WU21_HELLO_SHA256  /tmp/hello-elementor.tar.gz" | sha256sum -c -
          mkdir -p /tmp/hello-elementor
          tar -xzf /tmp/hello-elementor.tar.gz -C /tmp/hello-elementor --strip-components=1
          mv /tmp/hello-elementor "$WU21_WP_PATH/wp-content/themes/hello-elementor"
          test "$(php "$WU21_WP_CLI" theme get hello-elementor --field=version --path="$WU21_WP_PATH")" = "$WU21_HELLO_VERSION"

      - name: Activate exact host packages
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
          php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles srwf-registration-theme --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" plugin status gravityforms --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" plugin status gravityflow --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" plugin status gravity-presentation-profiles --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" plugin status srwf-registration-theme --path="$WU21_WP_PATH"

      - name: Execute source and settings discovery probe
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-source-probe.php
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-host-source-probe.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-gap-source-probe.php
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-host-gap-source-probe.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-save-progress-source-probe.php
          test -s "$WU21_ARTIFACT_DIR/srwf-pr149-save-progress-source.json"

      - name: Falsify historical split-assignee correction topology
        shell: bash
        run: |
          set -euo pipefail
          log="$WU21_ARTIFACT_DIR/srwf-journey-host-split-assignee-falsification.txt"
          set +e
          SRWF_JOURNEY_FORCE_DIFFERENT_CORRECTION_ASSIGNEE=1 \
            php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-runtime.php >"$log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'SAME_OPERATOR_ASSIGNMENT_INVARIANT_FAILED' "$log"
          test ! -s "$WU21_ARTIFACT_DIR/srwf-journey-host-manifest.json"
          printf '\nEXPECTED_FAILURE_CONFIRMED=1\n' >>"$log"

      - name: Create authentic journey runtime fixtures
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-runtime.php
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-host-manifest.json"

      - name: Set up exact Node runtime and Playwright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          node tests/repro-evidence-lab/srwf-journey-save-progress-finalization-test.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-pr149-save-progress-finalization-falsification.json"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.55.0') process.exit(1);"

      - name: Start WordPress and execute authentic browser qualification
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/srwf-journey-wp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null

          # Canonical PR #97 regression guard runs first on its untouched fixture.
          node tests/repro-evidence-lab/srwf-journey-host-browser.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-host-browser-results.json"

          # Recreate the same canonical host fixture in the same pinned runtime so
          # production evidence starts from fresh Review entries rather than from
          # entries consumed by the qualification scenarios above.
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option delete gpp_srwf_journey_host_manifest || true
          rm -f "$WU21_ARTIFACT_DIR/srwf-journey-host-manifest.json"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-host-runtime.php
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-production-setup.php
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-setup.json"

          # Preserve the existing 13 production journey assertions unchanged.
          node tests/repro-evidence-lab/srwf-journey-production-browser.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-browser.json"
          node -e 'const fs=require("fs"); const p=process.env.WU21_ARTIFACT_DIR+"/srwf-journey-production-browser.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); if(!Array.isArray(j.results)||j.results.length!==13||j.results.some(x=>x.status!=="PASS")) process.exit(1);'

          # MR-2 remains on the historical Journey host. MR-4 switches to the
          # pinned forward host only for its own acceptance boundary below.
          node tests/repro-evidence-lab/srwf-journey-production-mr2-action-state-browser.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-mr2-action-state-browser.json"
          node -e 'const fs=require("fs"); const p=process.env.WU21_ARTIFACT_DIR+"/srwf-journey-production-mr2-action-state-browser.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); if(!Array.isArray(j.results)||j.results.length!==8||j.results.some(x=>x.status!=="PASS")) process.exit(1);'

          base_theme="$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")"
          test -n "$base_theme"
          test "$base_theme" != 'hello-elementor'
          php "$WU21_WP_CLI" theme activate hello-elementor --path="$WU21_WP_PATH"
          test "$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")" = 'hello-elementor'

          # MR-4 closes correction-mode Entry Detail composition while keeping
          # Gravity Flow / Gravity Forms authoritative for the editable step.
          set +e
          node tests/repro-evidence-lab/srwf-journey-production-mr4-browser.mjs
          mr4_status=$?
          set -e

          # Evidence-only optional native Save Progress qualification on the same
          # authentic pinned forward host. This restores only its disposable
          # User Input feed setting; no GPP product or host code is modified.
          set +e
          node tests/repro-evidence-lab/srwf-journey-save-progress-browser.mjs
          native_save_status=$?
          set -e

          # Restore the historical host before the pre-existing downstream
          # Journey probes, even when MR-4 itself fails.
          php "$WU21_WP_CLI" theme activate "$base_theme" --path="$WU21_WP_PATH"
          test "$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")" = "$base_theme"
          test "$mr4_status" -eq 0
          test "$native_save_status" -eq 0
          test -s "$WU21_ARTIFACT_DIR/srwf-pr149-save-progress-browser.json"
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-mr4-browser.json"
          node -e 'const fs=require("fs"); const p=process.env.WU21_ARTIFACT_DIR+"/srwf-journey-production-mr4-browser.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); if(!Array.isArray(j.results)||j.results.length!==8||j.results.some(x=>x.status!=="PASS")) process.exit(1);'

          # Gap-closure probes are evidence capture, not product-success assertions.
          # They may document a negative capability finding while the harness stays
          # green; only an inability to execute/capture the requested boundary fails.
          node tests/repro-evidence-lab/srwf-journey-host-gap-closure-browser.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-host-gap-closure-browser.json"
          node -e 'const fs=require("fs"); const p=process.env.WU21_ARTIFACT_DIR+"/srwf-journey-host-gap-closure-browser.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); if(!Array.isArray(j.results)||j.results.length!==9||j.results.some(x=>x.status!=="CAPTURED")) process.exit(1);'

          # MR-6 is the last positive canonical journey after the historical
          # probes and before the topology-mutating split-assignee control. It
          # reuses the same pinned Hello Elementor host and production services.
          php "$WU21_WP_CLI" theme activate hello-elementor --path="$WU21_WP_PATH"
          test "$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")" = 'hello-elementor'
          set +e
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/srwf-journey-production-mr6-setup.php
          mr6_setup_status=$?
          mr6_status=1
          if [ "$mr6_setup_status" -eq 0 ]; then
            node tests/repro-evidence-lab/srwf-journey-production-mr6-integrated-browser.mjs
            mr6_status=$?
          fi
          set -e

          # Restore the historical theme before the intentionally destructive
          # split-assignee negative control, including if MR-6 captured failure.
          php "$WU21_WP_CLI" theme activate "$base_theme" --path="$WU21_WP_PATH"
          test "$(php "$WU21_WP_CLI" option get stylesheet --path="$WU21_WP_PATH")" = "$base_theme"

          # Execute exact-head negative controls only after every canonical
          # positive journey. The split-assignee case mutates the shared form by
          # adding workflow steps and intentionally has no topology cleanup.
          node tests/repro-evidence-lab/srwf-journey-production-negative-controls.mjs
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-negative-controls.json"
          node -e 'const fs=require("fs"); const p=process.env.WU21_ARTIFACT_DIR+"/srwf-journey-production-negative-controls.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); const ids=["SRWF-PROD-BACK-LINK-FORCE-ON-001","SRWF-PROD-BACK-LINK-FORCE-OFF-001","SRWF-PROD-BACK-LINK-CONTROL-RESET-001","SRWF-PROD-STATUS-SHORTCODE-CTA-NEGATIVE-001","SRWF-PROD-STATUS-BLOCK-CTA-NEGATIVE-001","SRWF-PROD-SPLIT-ASSIGNEE-NEGATIVE-001"]; if(!Array.isArray(j.results)||j.results.length!==ids.length||ids.some(id=>!j.results.some(x=>x.id===id&&x.status==="PASS"))) process.exit(1);'

          # Enforce the independently captured MR-6 result only after the
          # negative controls have also executed and produced their evidence.
          test "$mr6_setup_status" -eq 0
          test "$mr6_status" -eq 0
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-mr6-setup.json"
          test -s "$WU21_ARTIFACT_DIR/srwf-journey-production-mr6-integrated-browser.json"
          node -e 'const fs=require("fs"); const p=process.env.WU21_ARTIFACT_DIR+"/srwf-journey-production-mr6-integrated-browser.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); if(j.runtime!=="REPRODUCIBLE_PINNED_FORWARD_HELLO"||!Array.isArray(j.results)||j.results.length!==6||j.results.some(x=>x.status!=="PASS")) process.exit(1);'

          kill "$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srwf-journey-host-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/srwf-journey-artifacts/**
            /tmp/srwf-journey-wp-server.log
          if-no-files-found: warn
          retention-days: 30
