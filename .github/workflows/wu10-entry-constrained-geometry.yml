name: WU10 Entry Detail Constrained Geometry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wu10-entry-constrained-geometry.yml'
      - 'assets/css/srwf-gravity-flow-entry-detail.css'
      - 'src/SRWF/GravityFlow/**'
      - 'tests/repro-evidence-lab/setup-fixtures.php'
      - 'tests/repro-evidence-lab/setup-wu18-fixtures.php'
      - 'tests/repro-evidence-lab/wu10-entry-constrained-geometry-browser-control.mjs'
      - 'profiles/srwf/operations/operations-package-v1.json'
      - 'gravity-presentation-profiles.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constrained-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-wu10-root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-wu10-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WU21_WP_PATH: /tmp/wu10-wordpress
      WU21_ARTIFACT_DIR: /tmp/wu10-artifacts
      WU21_PACKAGE_DIR: /tmp/wu10-packages
      WU21_GF_ZIP: /tmp/wu10-packages/gravityforms.zip
      WU21_FLOW_ZIP: /tmp/wu10-packages/gravityflow.zip
      WU21_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      WU21_FLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      WU21_GF_SIZE: '5300290'
      WU21_FLOW_SIZE: '2603034'
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080
      WU10_ADMIN_PASSWORD: wu21-bootstrap-pass-2026
      WU10_CANDIDATE_MODE: host-relative-width

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$WU21_ARTIFACT_DIR" "$WU21_PACKAGE_DIR"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.33'
          coverage: none
          extensions: mysqli
          tools: composer:2.8.12

      - name: Repository validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.3.33"
          composer validate --no-check-publish
          php -l tests/repro-evidence-lab/setup-wu18-fixtures.php
          php tests/run.php

      - name: Install exact WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
          mkdir -p "$WU21_WP_PATH"
          php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=7.1.1 --force
          php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-wu10-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title='WU10 Synthetic Lab' --admin_user=bootstrap_admin --admin_password="$WU10_ADMIN_PASSWORD" --admin_email='bootstrap@example.invalid' --skip-email
          php "$WU21_WP_CLI" user create wu21_viewer wu21.viewer@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass='wu10-synthetic-viewer-2026'
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option update home "$WU21_BASE_URL"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" option update siteurl "$WU21_BASE_URL"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure '/%postname%/'
          test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "7.1.1"

      - name: Fetch and byte-verify pinned Gravity packages
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -o "$WU21_GF_ZIP" "https://drive.usercontent.google.com/download?id=10pDROZVyqELKzSzIiJrOyEWKjxS8r22Q&export=download&confirm=t"
          curl -L --fail --retry 4 -o "$WU21_FLOW_ZIP" "https://drive.usercontent.google.com/download?id=1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf&export=download&confirm=t"
          test "$(stat -c '%s' "$WU21_GF_ZIP")" = "$WU21_GF_SIZE"
          test "$(stat -c '%s' "$WU21_FLOW_ZIP")" = "$WU21_FLOW_SIZE"
          echo "$WU21_GF_SHA256  $WU21_GF_ZIP" | sha256sum -c -
          echo "$WU21_FLOW_SHA256  $WU21_FLOW_ZIP" | sha256sum -c -
          unzip -q "$WU21_GF_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
          unzip -q "$WU21_FLOW_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
          grep -q '^Version: 3\.1\.1\.1$' "$WU21_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
          grep -q '^Version: 3\.1\.0$' "$WU21_WP_PATH/wp-content/plugins/gravityflow/gravityflow.php"

      - name: Build authentic WU18 Entry Detail fixture
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
          php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-fixtures.php
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-wu18-fixtures.php
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval '$m=get_option("gpp_wu18_fixture_manifest"); $text=str_repeat("متن آزمایشی بلند فارسی برای سنجش شکستن خط و جلوگیری از سرریز افقی در میزبان محدود. ",12); $r=GFAPI::update_entry_field((int)$m["alpha"]["entry_id"],(int)$m["alpha"]["fields"]["school.name"],$text); if(is_wp_error($r)){throw new RuntimeException($r->get_error_message());}'
          test -s "$WU21_ARTIFACT_DIR/wu18-fixture-manifest.json"

      - name: Set up exact browser runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.55.0') process.exit(1);"

      - name: Execute constrained-host browser qualification
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/wu10-wp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null
          node tests/repro-evidence-lab/wu10-entry-constrained-geometry-browser-control.mjs
          test -s "$WU21_ARTIFACT_DIR/wu10-entry-constrained-geometry.json"

      - name: Upload WU10 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wu10-entry-constrained-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/wu10-artifacts/wu10-*.json
            /tmp/wu10-artifacts/wu10-*.png
            /tmp/wu10-artifacts/wu18-fixture-manifest.json
            /tmp/wu10-wp-server.log
          if-no-files-found: warn
          retention-days: 30
