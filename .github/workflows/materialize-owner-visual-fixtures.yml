name: Materialize locked Owner visual fixtures

on:
  push:
    branches:
      - test/core-spine-visual-qualification
    paths:
      - '.github/workflows/materialize-owner-visual-fixtures.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/core-spine-visual-qualification
          fetch-depth: 1
      - name: Materialize exact hash-locked Owner fixtures
        shell: bash
        env:
          OWNER_HTML_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-c018-820a-bc66-b07e8976576b/raw?se=2026-09-14T21%3A07%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=af5ecd5f-fa75-5623-b9a2-1c8831914c4d&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A05%3A51Z&ske=2026-09-15T20%3A05%3A51Z&sks=b&skv=2026-02-06&sig=1%2BF4JZwOa9aNNiTsGEL2sfufsg25KpU%2BahaGAW9B6/E%3D'
          OWNER_PDF_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-38b4-8210-97a7-61bd2f50dd92/raw?se=2026-09-14T21%3A07%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=61dea82a-36f2-5fba-9fa5-a5763b66357d&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A10%3A14Z&ske=2026-09-15T20%3A10%3A14Z&sks=b&skv=2026-02-06&sig=mwLoJus/DIIPjlzziX1qYRpYGsiTZecxJfb%2BBDUCBnQ%3D'
        run: |
          set -euo pipefail
          fixture_dir='tests/fixtures/owner-visual'
          html="$fixture_dir/PersianGravity-Visual-Reference-Final.html"
          pdf="$fixture_dir/PersianGravity-Final-Print-Sample.pdf"
          mkdir -p "$fixture_dir"
          curl -L --fail --retry 2 -o "$html" "$OWNER_HTML_URL"
          curl -L --fail --retry 2 -o "$pdf" "$OWNER_PDF_URL"
          test "$(stat -c '%s' "$html")" = '115728'
          test "$(stat -c '%s' "$pdf")" = '321990'
          echo '666704ac25b019ae59406974a223d10cace3f90e96f9d55312730ae93af09c81  '"$html" | sha256sum -c -
          echo '34d9b4e137667ca103d5c6e7752f7148f0c92e36f0f1d182d7d87a890c55fec5  '"$pdf" | sha256sum -c -
          git config user.name 'gpp-qualification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$html" "$pdf"
          git diff --cached --quiet && exit 0
          git commit -m 'test: pin Owner visual qualification fixtures'
          git push origin HEAD:test/core-spine-visual-qualification
