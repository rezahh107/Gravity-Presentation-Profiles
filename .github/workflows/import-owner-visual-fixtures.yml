name: Bootstrap locked Owner visual fixtures

on:
  push:
    branches:
      - test/core-spine-visual-qualification
    paths:
      - '.github/workflows/import-owner-visual-fixtures.yml'

permissions:
  contents: write

jobs:
  import-exact-owner-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/core-spine-visual-qualification
          fetch-depth: 1
      - name: Acquire and verify exact locked Owner bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'gdown==5.2.0'
          mkdir -p tests/fixtures/owner-visual
          gdown --id 13uGhCEGVCkwS1RUR8OFHC1kOwBpjzS7Y -O tests/fixtures/owner-visual/PersianGravity-Visual-Reference-Final.html
          gdown --id 1yBSgBje68ewUKgzugMCty3LWtwP_-k2j -O tests/fixtures/owner-visual/PersianGravity-Final-Print-Sample.pdf
          test "$(stat -c '%s' tests/fixtures/owner-visual/PersianGravity-Visual-Reference-Final.html)" = '115728'
          test "$(stat -c '%s' tests/fixtures/owner-visual/PersianGravity-Final-Print-Sample.pdf)" = '321990'
          echo '666704ac25b019ae59406974a223d10cace3f90e96f9d55312730ae93af09c81  tests/fixtures/owner-visual/PersianGravity-Visual-Reference-Final.html' | sha256sum -c -
          echo '34d9b4e137667ca103d5c6e7752f7148f0c92e36f0f1d182d7d87a890c55fec5  tests/fixtures/owner-visual/PersianGravity-Final-Print-Sample.pdf' | sha256sum -c -
      - name: Commit only verified immutable fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/owner-visual/PersianGravity-Visual-Reference-Final.html tests/fixtures/owner-visual/PersianGravity-Final-Print-Sample.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'test: commit locked owner visual references'
          git push origin HEAD:test/core-spine-visual-qualification
