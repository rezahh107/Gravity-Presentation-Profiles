name: Temporary Entry Detail vNext Executor

on:
  push:
    branches: [feat/entry-detail-vnext-convergence]

permissions:
  contents: write

jobs:
  apply-vnext:
    if: ${{ !contains(github.event.head_commit.message, '[vnext-executor]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/entry-detail-vnext-convergence
          fetch-depth: 0
      - name: Materialize and verify exact Owner vNext bytes
        shell: bash
        run: |
          set -euo pipefail
          target='tests/fixtures/owner-visual/PersianGravity-Visual-Reference-Final-vNext.html'
          cat .gpp-executor/vnext-html/chunk-* | base64 -d | gzip -d > "$target"
          test "$(stat -c '%s' "$target")" = '119765'
          echo '1934967b81d82ee77c60ffd547dde6fa7c8a310dbde94556686bd3d515d62a69  '"$target" | sha256sum -c -
      - name: Apply bounded vNext migration and structural repair
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .gpp-executor/apply_entry_vnext.py.gz.b64 | gzip -d > /tmp/apply_entry_vnext.py
          python /tmp/apply_entry_vnext.py

          # Strengthen the generated host-node composition to make the move
          # transaction fully reversible until post-move form ownership is proven.
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/js/srwf-gravity-flow-entry-detail.js')
          text = path.read_text()
          old = '''        // All destructive/reparenting prerequisites have now been proven.\n        if (instructions.length === 1) instructionsTarget.append(instructions[0]);\n        editorTarget.append(editor);\n        if (approvalStatusBox) statusTarget.append(approvalStatusBox);\n        if (timelines.length === 1) historyTarget.append(timelines[0]);\n        else historyRegion?.remove();\n\n        // Prove state-changing controls still belong to their original form\n        // after reparenting before native fallback is visually replaced.\n        if (actionsExpected) {\n            const actions = unique(dossier, '.gravityflow-action-buttons');\n            if (!actions || actions.closest('form') !== form || !statusTarget.contains(actions)) {\n                fail(dossier, form, 'post-move-form-ownership');\n                return;\n            }\n        }\n'''
          new = '''        // All destructive/reparenting prerequisites have now been proven.\n        // Preserve exact native anchors so any unexpected post-move failure\n        // can restore the host UI before GPP falls back.\n        const movingNodes = [\n            instructions.length === 1 ? instructions[0] : null,\n            editor,\n            approvalStatusBox,\n            timelines.length === 1 ? timelines[0] : null,\n        ].filter(Boolean);\n        const anchors = movingNodes.map(node => ({ node, parent: node.parentNode, next: node.nextSibling }));\n        const rollback = () => {\n            for (const anchor of anchors.slice().reverse()) {\n                if (!anchor.parent) continue;\n                if (anchor.next && anchor.next.parentNode === anchor.parent) anchor.parent.insertBefore(anchor.node, anchor.next);\n                else anchor.parent.append(anchor.node);\n            }\n        };\n\n        try {\n            if (instructions.length === 1) instructionsTarget.append(instructions[0]);\n            editorTarget.append(editor);\n            if (approvalStatusBox) statusTarget.append(approvalStatusBox);\n            if (timelines.length === 1) historyTarget.append(timelines[0]);\n\n            // Re-prove state-changing controls still belong to their original\n            // form after movement and before marking composition successful.\n            if (actionsExpected) {\n                const actions = unique(dossier, '.gravityflow-action-buttons');\n                if (!actions || actions.closest('form') !== form || !statusTarget.contains(actions)) {\n                    throw new Error('post-move-form-ownership');\n                }\n            }\n        } catch (error) {\n            rollback();\n            fail(dossier, form, error?.message || 'composition-move-failed');\n            return;\n        }\n\n        // Optional GPP history chrome is removed only after host movement has\n        // succeeded, so rollback never needs to recreate GPP-owned markup.\n        if (timelines.length === 0) historyRegion?.remove();\n'''
          if text.count(old) != 1:
              raise SystemExit(f'transactional composition patch expected 1 block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l src/SRWF/GravityFlow/EntryDetailPresentationAdapter.php
          node --check assets/js/srwf-gravity-flow-entry-detail.js
          node --check tests/repro-evidence-lab/entry-visual-contract-tests.mjs
          node --check tests/repro-evidence-lab/wu18-browser-tests.mjs
          bash -n tests/repro-evidence-lab/verify-owner-visual-fixtures.sh
          bash tests/repro-evidence-lab/verify-owner-visual-fixtures.sh .
          git diff --check
      - name: Commit bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SRWF/GravityFlow/EntryDetailPresentationAdapter.php \
                  assets/js/srwf-gravity-flow-entry-detail.js \
                  assets/css/srwf-gravity-flow-entry-detail.css \
                  tests/fixtures/owner-visual/PersianGravity-Visual-Reference-Final-vNext.html \
                  tests/repro-evidence-lab/verify-owner-visual-fixtures.sh \
                  tests/repro-evidence-lab/entry-visual-contract-tests.mjs \
                  tests/repro-evidence-lab/wu18-browser-tests.mjs \
                  tests/repro-evidence-lab/wu18-post-browser-controls.php \
                  tests/repro-evidence-lab/core-spine-browser-tests.mjs \
                  tests/repro-evidence-lab/build-qualification-evidence.php \
                  .github/workflows/wu19-a4-print-runtime.yml \
                  docs/visual/ENTRY_DETAIL_VNEXT_AUTHORITY_MIGRATION_V1.md
          test -n "$(git diff --cached --name-only)"
          git commit -m '[vnext-executor] Entry Detail vNext authority and structural convergence'
          git push origin HEAD:feat/entry-detail-vnext-convergence
