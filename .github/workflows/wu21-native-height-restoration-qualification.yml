name: PR87 Native Height Restoration Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wu21-native-height-restoration-qualification.yml'
      - 'tests/repro-evidence-lab/inbox-native-height-restoration-experiment.mjs'

permissions:
  contents: read

jobs:
  native-height-restoration:
    name: Test-only native height restoration counterfactual
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: gpp-wu21-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pgpp-wu21-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GPP_BOUND_HEAD: 58176df6d7232e3996a62c5d1261b3172402b8aa
      WU21_WP_PATH: /tmp/wu21-wordpress
      WU21_ARTIFACT_DIR: /tmp/wu21-artifacts
      WU21_PACKAGE_DIR: /tmp/wu21-packages
      WU21_PACKAGE_FIXTURE_DIR: tests/fixtures/wu21-packages
      WU21_GF_ZIP: /tmp/wu21-packages/gravityforms-3.1.1.1-owner-supplied-source-package.zip
      WU21_FLOW_ZIP: /tmp/wu21-packages/gravityflow-3.1.0-owner-supplied-source-package.zip
      WU21_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      WU21_FLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      WU21_GF_SIZE: '5300290'
      WU21_FLOW_SIZE: '2603034'
      WU21_WP_CLI: /tmp/wp-cli.phar
      WU21_BASE_URL: http://127.0.0.1:8080
      WU21_PERMALINK_STRUCTURE: '/%postname%/'

    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove production source is byte-identical to bound PR87 Head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/Gravity-Presentation-Profiles"
          test "$(git merge-base "$GPP_BOUND_HEAD" HEAD)" = "$GPP_BOUND_HEAD"
          git diff --exit-code "$GPP_BOUND_HEAD" HEAD -- \
            gravity-presentation-profiles.php \
            src \
            assets/css \
            assets/js
          changed="$(git diff --name-only "$GPP_BOUND_HEAD" HEAD)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(.github/workflows/wu21-native-height-restoration-qualification.yml|tests/repro-evidence-lab/inbox-native-height-restoration-experiment.mjs)$'; then
            echo 'Qualification branch contains changes outside the two admitted test-only files.' >&2
            exit 1
          fi
          mkdir -p "$WU21_ARTIFACT_DIR" "$WU21_PACKAGE_DIR"
          printf '%s\n' "$changed" > "$WU21_ARTIFACT_DIR/qualification-changed-files.txt"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          coverage: none
          extensions: mysqli

      - name: Install exact WP-CLI and WordPress
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.2.34"
          curl -L --fail --retry 3 -o "$WU21_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU21_WP_CLI" | sha256sum -c -
          mkdir -p "$WU21_WP_PATH"
          php "$WU21_WP_CLI" core download --path="$WU21_WP_PATH" --version=6.8.3 --force
          php "$WU21_WP_CLI" config create --path="$WU21_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=gpp-wu21-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU21_WP_CLI" core install --path="$WU21_WP_PATH" --url="$WU21_BASE_URL" --title='WU21 PR87 Qualification' --admin_user=bootstrap_admin --admin_password='wu21-bootstrap-pass-2026' --admin_email='bootstrap@example.invalid' --skip-email
          php "$WU21_WP_CLI" user create wu21_viewer wu21.viewer@example.invalid --path="$WU21_WP_PATH" --role=subscriber --user_pass='wu21-synthetic-viewer-2026'
          test "$(php "$WU21_WP_CLI" core version --path="$WU21_WP_PATH")" = "6.8.3"
          php "$WU21_WP_CLI" option update home "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" option update siteurl "$WU21_BASE_URL" --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" rewrite structure "$WU21_PERMALINK_STRUCTURE"

      - name: Verify and install repository-owned Gravity packages
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$GITHUB_WORKSPACE/$WU21_PACKAGE_FIXTURE_DIR"
          php tests/repro-evidence-lab/verify-wu21-package-fixtures.php "$fixture_root"
          cp "$fixture_root/gravityforms-3.1.1.1-owner-supplied-source-package.zip" "$WU21_GF_ZIP"
          cp "$fixture_root/gravityflow-3.1.0-owner-supplied-source-package.zip" "$WU21_FLOW_ZIP"
          test "$(stat -c '%s' "$WU21_GF_ZIP")" = "$WU21_GF_SIZE"
          test "$(stat -c '%s' "$WU21_FLOW_ZIP")" = "$WU21_FLOW_SIZE"
          echo "$WU21_GF_SHA256  $WU21_GF_ZIP" | sha256sum -c -
          echo "$WU21_FLOW_SHA256  $WU21_FLOW_ZIP" | sha256sum -c -
          unzip -q "$WU21_GF_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
          unzip -q "$WU21_FLOW_ZIP" -d "$WU21_WP_PATH/wp-content/plugins"
          grep -q '^Version: 3\.1\.1\.1$' "$WU21_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
          grep -q '^Version: 3\.1\.0$' "$WU21_WP_PATH/wp-content/plugins/gravityflow/gravityflow.php"

      - name: Activate exact plugins and create authentic WU21 fixtures
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE" "$WU21_WP_PATH/wp-content/plugins/gravity-presentation-profiles"
          mkdir -p "$WU21_WP_PATH/wp-content/mu-plugins"
          cp tests/repro-evidence-lab/wu21-lab-plugin.php "$WU21_WP_PATH/wp-content/mu-plugins/wu21-lab-plugin.php"
          php "$WU21_WP_CLI" plugin activate gravityforms gravityflow gravity-presentation-profiles --path="$WU21_WP_PATH"
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/setup-fixtures.php
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/capture-runtime.php
          php "$WU21_WP_CLI" --path="$WU21_WP_PATH" eval-file tests/repro-evidence-lab/php-tests.php
          test -s "$WU21_ARTIFACT_DIR/fixture-manifest.json"
          test -s "$WU21_ARTIFACT_DIR/runtime.json"
          test -s "$WU21_ARTIFACT_DIR/php-results.json"

      - name: Set up exact Node and Playwright runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact Playwright and initialize authentic Block fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const a=require('playwright/package.json').version;if(a!=='1.55.0')process.exit(1);console.log('playwright@'+a)"
          node tests/repro-evidence-lab/p06-fixture-lifecycle-falsification.mjs

      - name: Start ephemeral WordPress HTTP server
        shell: bash
        run: |
          set -euo pipefail
          php "$WU21_WP_CLI" server --path="$WU21_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/wu21-pr87-qualification-server.log 2>&1 &
          echo $! >/tmp/wu21-pr87-qualification-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "$WU21_BASE_URL/wp-login.php" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wu21-pr87-qualification-server.log >&2
          exit 1

      - name: Execute Native-Height Restoration Counterfactual
        shell: bash
        run: |
          set -euo pipefail
          node tests/repro-evidence-lab/inbox-native-height-restoration-experiment.mjs

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr87-native-height-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/wu21-artifacts/native-height-restoration-experiment.json
            /tmp/wu21-artifacts/runtime.json
            /tmp/wu21-artifacts/fixture-manifest.json
            /tmp/wu21-artifacts/php-results.json
            /tmp/wu21-artifacts/p06-fixture-initialization.json
            /tmp/wu21-artifacts/p06-fixture-lifecycle-falsification.json
            /tmp/wu21-artifacts/qualification-changed-files.txt
            /tmp/wu21-pr87-qualification-server.log
          if-no-files-found: warn
          retention-days: 14
