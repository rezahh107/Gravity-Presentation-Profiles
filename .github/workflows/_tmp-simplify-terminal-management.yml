name: Temporary simplify terminal management repair

on:
  push:
    branches:
      - fix/srwf-terminal-management-access

permissions:
  contents: write

jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/srwf-terminal-management-access
          fetch-depth: 0
      - name: Reduce production repair to proven native request class
        shell: bash
        run: |
          set -euo pipefail
          base='8d2b066c64ffc0963bdfc45829495ffb4d08cf8d'
          git show "$base:src/Bootstrap.php" > src/Bootstrap.php
          git show "$base:src/SRWF/GravityFlow/EntryDetailRequestReachability.php" > src/SRWF/GravityFlow/EntryDetailRequestReachability.php
          rm -f src/SRWF/GravityFlow/EntryDetailAdminPresentationContext.php

          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/srwf-gravity-flow-entry-detail-journey.css')
          css = css_path.read_text()
          if css.count('gpp-srwf-entry-detail-admin-context') != 4:
              raise SystemExit('Unexpected admin-context selector count before simplification.')
          css = css.replace('gpp-srwf-entry-detail-admin-context', 'wp-admin')
          css = css.replace(
              ' * surface. The explicit server-established admin request-context class narrows\n * wp-admin suppression so Gravity Flow can keep its own terminal status/admin\n',
              ' * surface. The native WordPress wp-admin body class narrows suppression so\n * Gravity Flow can keep its own terminal status/admin\n',
              1,
          )
          css_path.write_text(css)

          test_path = Path('tests/cases/entry-detail-journey-presentation.php')
          base = Path('/tmp/base-entry-detail-journey.php')
          test = base.read_text()
          old = '''$terminal_targets = ':is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print)';
          foreach ( array( 'approved', 'rejected' ) as $terminal_state ) {
              $terminal_marker = '.gpp-entry-journey-result[data-gpp-entry-journey-result="' . $terminal_state . '"]';
              $terminal_boundary = '.gravityflow_workflow_detail form:has(' . $terminal_marker . ')';
              gpp_journey_assert(
                  false !== strpos( $css, $terminal_boundary . ' ' . $terminal_targets ),
                  'MR-5 terminal result must suppress only the proven competing native Entry Detail surfaces for ' . $terminal_state . '.'
              );
              gpp_journey_assert(
                  false === strpos( $css, $terminal_marker . ' .gpp-entry-journey__case-context' ),
                  'MR-5 terminal identity must be omitted by server markup, not implemented as CSS-only hiding for ' . $terminal_state . '.'
              );
              gpp_journey_assert(
                  false === strpos( $css, $terminal_boundary . ' .gpp-entry-print-utility' ),
                  'MR-5 terminal convergence must preserve the separately authorized GPP dossier Print utility for ' . $terminal_state . '.'
              );
          }
          '''
          new = '''$frontend_terminal_targets = ':is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print)';
          $admin_terminal_targets = ':is(.entry-detail-view, #postbox-container-2, .detail-view-print)';
          foreach ( array( 'approved', 'rejected' ) as $terminal_state ) {
              $terminal_marker = '.gpp-entry-journey-result[data-gpp-entry-journey-result="' . $terminal_state . '"]';
              $frontend_boundary = 'body:not(.wp-admin) .gravityflow_workflow_detail form:has(' . $terminal_marker . ')';
              $admin_boundary = 'body.wp-admin .gravityflow_workflow_detail form:has(' . $terminal_marker . ')';
              gpp_journey_assert(
                  false !== strpos( $css, $frontend_boundary . ' ' . $frontend_terminal_targets ),
                  'Frontend terminal Result-only suppression must retain all established competing native targets for ' . $terminal_state . '.'
              );
              gpp_journey_assert(
                  false !== strpos( $css, $admin_boundary . ' ' . $admin_terminal_targets ),
                  'Admin terminal suppression must preserve the host-owned status/management container for ' . $terminal_state . '.'
              );
              gpp_journey_assert(
                  false === strpos( $css, $admin_boundary . ' ' . $frontend_terminal_targets ),
                  'Admin terminal context must not suppress #postbox-container-1 for ' . $terminal_state . '.'
              );
              gpp_journey_assert(
                  false === strpos( $css, $terminal_marker . ' .gpp-entry-journey__case-context' ),
                  'MR-5 terminal identity must be omitted by server markup, not implemented as CSS-only hiding for ' . $terminal_state . '.'
              );
              gpp_journey_assert(
                  false === strpos( $css, $frontend_boundary . ' .gpp-entry-print-utility' )
                  && false === strpos( $css, $admin_boundary . ' .gpp-entry-print-utility' ),
                  'Terminal convergence must preserve the separately authorized GPP dossier Print utility for ' . $terminal_state . '.'
              );
          }
          '''
          if test.count(old) != 1:
              raise SystemExit('Base terminal assertion block changed unexpectedly.')
          test_path.write_text(test.replace(old, new, 1))
          PY
        env:
          BASE_SHA: 8d2b066c64ffc0963bdfc45829495ffb4d08cf8d
      - name: Prepare base test source
        shell: bash
        run: |
          set -euo pipefail
          git show 8d2b066c64ffc0963bdfc45829495ffb4d08cf8d:tests/cases/entry-detail-journey-presentation.php > /tmp/base-entry-detail-journey.php
      - name: Apply test replacement after base source exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          test_path = Path('tests/cases/entry-detail-journey-presentation.php')
          test = Path('/tmp/base-entry-detail-journey.php').read_text()
          old = '''$terminal_targets = ':is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print)';
foreach ( array( 'approved', 'rejected' ) as $terminal_state ) {
    $terminal_marker = '.gpp-entry-journey-result[data-gpp-entry-journey-result="' . $terminal_state . '"]';
    $terminal_boundary = '.gravityflow_workflow_detail form:has(' . $terminal_marker . ')';
    gpp_journey_assert(
        false !== strpos( $css, $terminal_boundary . ' ' . $terminal_targets ),
        'MR-5 terminal result must suppress only the proven competing native Entry Detail surfaces for ' . $terminal_state . '.'
    );
    gpp_journey_assert(
        false === strpos( $css, $terminal_marker . ' .gpp-entry-journey__case-context' ),
        'MR-5 terminal identity must be omitted by server markup, not implemented as CSS-only hiding for ' . $terminal_state . '.'
    );
    gpp_journey_assert(
        false === strpos( $css, $terminal_boundary . ' .gpp-entry-print-utility' ),
        'MR-5 terminal convergence must preserve the separately authorized GPP dossier Print utility for ' . $terminal_state . '.'
    );
}
'''
          new = '''$frontend_terminal_targets = ':is(.entry-detail-view, #postbox-container-1, #postbox-container-2, .detail-view-print)';
$admin_terminal_targets = ':is(.entry-detail-view, #postbox-container-2, .detail-view-print)';
foreach ( array( 'approved', 'rejected' ) as $terminal_state ) {
    $terminal_marker = '.gpp-entry-journey-result[data-gpp-entry-journey-result="' . $terminal_state . '"]';
    $frontend_boundary = 'body:not(.wp-admin) .gravityflow_workflow_detail form:has(' . $terminal_marker . ')';
    $admin_boundary = 'body.wp-admin .gravityflow_workflow_detail form:has(' . $terminal_marker . ')';
    gpp_journey_assert(
        false !== strpos( $css, $frontend_boundary . ' ' . $frontend_terminal_targets ),
        'Frontend terminal Result-only suppression must retain all established competing native targets for ' . $terminal_state . '.'
    );
    gpp_journey_assert(
        false !== strpos( $css, $admin_boundary . ' ' . $admin_terminal_targets ),
        'Admin terminal suppression must preserve the host-owned status/management container for ' . $terminal_state . '.'
    );
    gpp_journey_assert(
        false === strpos( $css, $admin_boundary . ' ' . $frontend_terminal_targets ),
        'Admin terminal context must not suppress #postbox-container-1 for ' . $terminal_state . '.'
    );
    gpp_journey_assert(
        false === strpos( $css, $terminal_marker . ' .gpp-entry-journey__case-context' ),
        'MR-5 terminal identity must be omitted by server markup, not implemented as CSS-only hiding for ' . $terminal_state . '.'
    );
    gpp_journey_assert(
        false === strpos( $css, $frontend_boundary . ' .gpp-entry-print-utility' )
        && false === strpos( $css, $admin_boundary . ' .gpp-entry-print-utility' ),
        'Terminal convergence must preserve the separately authorized GPP dossier Print utility for ' . $terminal_state . '.'
    );
}
'''
          if test.count(old) != 1:
              raise SystemExit('Base terminal assertion block changed unexpectedly.')
          test_path.write_text(test.replace(old, new, 1))
          PY
          php -l tests/cases/entry-detail-journey-presentation.php
          php tests/cases/entry-detail-journey-presentation.php
          git diff --check
      - name: Commit simplification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Bootstrap.php src/SRWF/GravityFlow/EntryDetailRequestReachability.php assets/css/srwf-gravity-flow-entry-detail-journey.css tests/cases/entry-detail-journey-presentation.php
          git add -u src/SRWF/GravityFlow/EntryDetailAdminPresentationContext.php
          git commit -m 'fix: scope terminal repair to native wp-admin context'
          git push origin HEAD:fix/srwf-terminal-management-access
